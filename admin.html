<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASYMART BD - Pro Admin Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.75);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text); display: flex; min-height: 100vh; }

        #login-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg-dark); display:flex; justify-content:center; align-items:center; z-index:9999;
        }
        .login-card {
            background: var(--panel-bg); border: 1px solid var(--border); padding: 30px;
            border-radius: 16px; width: 90%; max-width: 380px; text-align: center;
        }

        .sidebar {
            width: 260px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid var(--border);
            padding: 20px 10px; display: flex; flex-direction: column; gap: 8px; position: fixed; height: 100vh;
        }
        .sidebar-brand { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 20px; color: var(--primary); }
        .nav-item {
            padding: 12px 16px; border-radius: 8px; color: #94a3b8; cursor: pointer;
            font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }

        .main-panel { margin-left: 260px; flex: 1; padding: 30px; max-width: 1000px; }
        .section-page { display: none; }
        .section-page.active { display: block; }

        .card-box {
            background: var(--panel-bg); border: 1px solid var(--border);
            border-radius: 14px; padding: 25px; margin-bottom: 20px; backdrop-filter: blur(10px);
        }
        .card-box h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
        input, select, textarea {
            width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border); border-radius: 8px; color: white; outline: none;
        }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-danger { background: #ef4444; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-panel { margin-left: 0; padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>Admin Security Login</h2>
            <div class="form-group" style="margin-top:15px;"><input type="text" id="admin-user" placeholder="Username"></div>
            <div class="form-group"><input type="password" id="admin-pass" placeholder="Password"></div>
            <button class="btn-submit" onclick="checkAuth()">Login</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-brand">EASYMART Admin</div>
        <div class="nav-item active" onclick="switchTab('overview')">📊 Overview</div>
        <div class="nav-item" onclick="switchTab('products')">🛍️ All Products</div>
        <div class="nav-item" onclick="switchTab('banners')">🖼️ Slider Banners (Multi)</div>
        <div class="nav-item" style="margin-top:auto; background:#ef4444; color:white;" onclick="logout()">🚪 Logout</div>
    </div>

    <div class="main-panel">

        <div id="page-overview" class="section-page active">
            <div class="card-box">
                <h2>📊 সাম্প্রতিক অর্ডারস</h2>
                <div id="recent-orders-list"></div>
            </div>
        </div>

        <div id="page-products" class="section-page">
            <div class="card-box">
                <h2>➕ নতুন প্রোডাক্ট যুক্ত করুন</h2>
                <form id="prod-form">
                    <div class="form-group"><label>পণ্যের নাম</label><input type="text" id="p-name" required></div>
                    <div class="form-group"><label>দাম (৳)</label><input type="number" id="p-price" required></div>
                    <div class="form-group"><label>ছবি আপলোড (Max 4MB)</label><input type="file" id="p-img" accept="image/*" required></div>
                    <button type="submit" class="btn-submit">পাবলিশ করুন</button>
                </form>
            </div>
            <div class="card-box">
                <h2>📦 সকল প্রোডাক্ট</h2>
                <div id="all-products-list"></div>
            </div>
        </div>

        <div id="page-banners" class="section-page">
            <div class="card-box">
                <h2>🖼️ নতুন স্লাইডার ব্যানার যুক্ত করুন</h2>
                <form id="banner-form">
                    <div class="form-group"><label>ব্যানার টেক্সট/শিরোনাম</label><input type="text" id="b-title"></div>
                    <div class="form-group"><label>ব্যানার ছবি (Max 4MB)</label><input type="file" id="b-img" accept="image/*" required></div>
                    <button type="submit" class="btn-submit">ব্যানার আপলোড করুন</button>
                </form>
            </div>
            <div class="card-box">
                <h2>বর্তমান ব্যানারসমূহ</h2>
                <div id="all-banners-list"></div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnrZ8ZF8tGW2R5buFDsAeLHJlWHBwb9hw",
            authDomain: "easy-mart-bd-16b7b.firebaseapp.com",
            databaseURL: "https://easy-mart-bd-16b7b-default-rtdb.firebaseio.com",
            projectId: "easy-mart-bd-16b7b",
            storageBucket: "easy-mart-bd-16b7b.firebasestorage.app",
            messagingSenderId: "421957488158",
            appId: "1:421957488158:web:7d20d1f557ac6b06c9280f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Add Product
        document.getElementById('prod-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('p-img').files[0];
            const reader = new FileReader();
            reader.onload = async function() {
                await addDoc(collection(db, "products"), {
                    title_bn: document.getElementById('p-name').value,
                    price: Number(document.getElementById('p-price').value),
                    image: reader.result
                });
                alert("প্রোডাক্ট যোগ হয়েছে!");
                e.target.reset();
            };
            reader.readAsDataURL(file);
        });

        // Add Banner
        document.getElementById('banner-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('b-img').files[0];
            const reader = new FileReader();
            reader.onload = async function() {
                await addDoc(collection(db, "banners"), {
                    title: document.getElementById('b-title').value,
                    image: reader.result
                });
                alert("স্লাইডার ব্যানার যোগ হয়েছে!");
                e.target.reset();
            };
            reader.readAsDataURL(file);
        });

        // Sync Products
        onSnapshot(collection(db, "products"), (snap) => {
            const list = document.getElementById('all-products-list');
            list.innerHTML = '';
            snap.forEach(d => {
                const p = d.data();
                list.innerHTML += `<div style="padding:10px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; align-items:center;"><span>${p.title_bn} (৳${p.price})</span><button class="btn-danger" onclick="deleteDocItem('products', '${d.id}')">Delete</button></div>`;
            });
        });

        // Sync Banners
        onSnapshot(collection(db, "banners"), (snap) => {
            const list = document.getElementById('all-banners-list');
            list.innerHTML = '';
            snap.forEach(d => {
                const b = d.data();
                list.innerHTML += `<div style="padding:10px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; align-items:center;"><span>${b.title || 'Banner'}</span><button class="btn-danger" onclick="deleteDocItem('banners', '${d.id}')">Delete</button></div>`;
            });
        });

        window.deleteDocItem = async (col, id) => { if(confirm("মুছতে চান?")) await deleteDoc(doc(db, col, id)); };
    </script>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.section-page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('page-' + tab).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function checkAuth() {
            if(document.getElementById('admin-user').value === 'Admin' && document.getElementById('admin-pass').value === 'tTtTahsin26') {
                document.getElementById('login-overlay').style.display = 'none';
                sessionStorage.setItem('admin_logged', 'true');
            } else alert("ভুল পাসওয়ার্ড!");
        }

        function logout() { sessionStorage.removeItem('admin_logged'); location.reload(); }
        if(sessionStorage.getItem('admin_logged') === 'true') { document.getElementById('login-overlay').style.display = 'none'; }
    </script>
</body>
</html>
