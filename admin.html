<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASYMART BD - Pro Admin Console</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --bg-dark: #0f172a;
            --glass-card: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Security Login Modal */
        #login-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-card {
            background: var(--glass-card); border: 1px solid var(--glass-border);
            padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* Glass Admin Header */
        header {
            background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .brand-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; color: #fff; }
        .logo-icon { width: 34px; height: 34px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; }

        .btn-logout { background: #ef4444; border: none; color: white; padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }

        /* Layout Container */
        .admin-container { max-width: 1100px; margin: 24px auto; width: 92%; flex: 1; display: grid; grid-template-columns: 240px 1fr; gap: 20px; }

        /* Sidebar Navigation */
        .sidebar {
            background: var(--glass-card); border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; height: fit-content;
        }
        .nav-tab {
            padding: 12px 16px; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: all 0.3s;
        }
        .nav-tab:hover, .nav-tab.active { background: var(--primary); color: white; box-shadow: 0 4px 15px var(--primary-glow); }

        /* Content Area */
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Glass Cards */
        .glass-box {
            background: var(--glass-card); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 18px; padding: 24px; margin-bottom: 20px;
        }
        .glass-box h3 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }

        /* Form Inputs */
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        input[type="text"], input[type="number"], input[type="password"], input[type="file"] {
            width: 100%; padding: 10px 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border); border-radius: 10px; color: white; outline: none; font-size: 14px;
        }
        input:focus { border-color: var(--primary); }

        .btn-submit {
            width: 100%; padding: 12px; background: var(--primary); border: none;
            border-radius: 10px; color: white; font-weight: 700; cursor: pointer; font-size: 14px;
            box-shadow: 0 4px 15px var(--primary-glow); transition: 0.3s;
        }
        .btn-submit:hover { opacity: 0.9; }

        /* List Items */
        .item-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            border-radius: 12px; margin-bottom: 10px;
        }
        .item-info { display: flex; align-items: center; gap: 12px; }
        .item-img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #334155; }
        .btn-delete { background: #ef4444; border: none; color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }

        @media (max-width: 768px) {
            .admin-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <div class="logo-icon" style="margin: 0 auto 15px auto; width:48px; height:48px; font-size:22px;"><i class="fa-solid fa-lock"></i></div>
            <h2 style="margin-bottom:15px; font-size:20px;">Admin Control Panel</h2>
            <div class="form-group"><input type="text" id="admin-user" placeholder="Username"></div>
            <div class="form-group"><input type="password" id="admin-pass" placeholder="Password"></div>
            <button class="btn-submit" onclick="checkAuth()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
        </div>
    </div>

    <header>
        <div class="brand-logo">
            <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
            <span>EASYMART BD Admin</span>
        </div>
        <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Logout</button>
    </header>

    <div class="admin-container">
        
        <div class="sidebar">
            <div class="nav-tab active" onclick="switchTab('products')"><i class="fa-solid fa-box"></i> Manage Products</div>
            <div class="nav-tab" onclick="switchTab('banners')"><i class="fa-solid fa-images"></i> Manage Banners</div>
        </div>

        <div class="content-area">

            <div id="tab-products" class="tab-content active">
                <div class="glass-box">
                    <h3><i class="fa-solid fa-plus"></i> নতুন প্রোডাক্ট যোগ করুন</h3>
                    <form id="prod-form">
                        <div class="form-group"><label>পণ্যের নাম (Title)</label><input type="text" id="p-name" placeholder="যেমন: ChatGPT Plus" required></div>
                        <div class="form-group"><label>মূল্য (৳ Price)</label><input type="number" id="p-price" placeholder="450" required></div>
                        <div class="form-group"><label>পণ্যের ছবি (Product Image)</label><input type="file" id="p-img" accept="image/*" required></div>
                        <button type="submit" class="btn-submit"><i class="fa-solid fa-cloud-arrow-up"></i> পাবলিশ করুন</button>
                    </form>
                </div>

                <div class="glass-box">
                    <h3><i class="fa-solid fa-list-check"></i> বর্তমান প্রোডাক্ট তালিকা (Live Update/Delete)</h3>
                    <div id="all-products-list"><p style="color:var(--text-muted); font-size:13px;">লোড হচ্ছে...</p></div>
                </div>
            </div>

            <div id="tab-banners" class="tab-content">
                <div class="glass-box">
                    <h3><i class="fa-solid fa-file-image"></i> নতুন ব্যানার স্লাইডার যোগ করুন</h3>
                    <form id="banner-form">
                        <div class="form-group"><label>ব্যানার শিরোনাম (Title - Optional)</label><input type="text" id="b-title" placeholder="Special Offer 50% Off"></div>
                        <div class="form-group"><label>ব্যানার ছবি (Banner Image)</label><input type="file" id="b-img" accept="image/*" required></div>
                        <button type="submit" class="btn-submit"><i class="fa-solid fa-upload"></i> ব্যানার আপলোড করুন</button>
                    </form>
                </div>

                <div class="glass-box">
                    <h3><i class="fa-solid fa-layer-group"></i> বর্তমান স্লাইডার ব্যানারসমূহ</h3>
                    <div id="all-banners-list"><p style="color:var(--text-muted); font-size:13px;">লোড হচ্ছে...</p></div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnrZ8ZF8tGW2R5buFDsAeLHJlWHBwb9hw",
            authDomain: "easy-mart-bd-16b7b.firebaseapp.com",
            databaseURL: "https://easy-mart-bd-16b7b-default-rtdb.firebaseio.com",
            projectId: "easy-mart-bd-16b7b",
            storageBucket: "easy-mart-bd-16b7b.firebasestorage.app",
            messagingSenderId: "421957488158",
            appId: "1:421957488158:web:7d20d1f557ac6b06c9280f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Upload Product to Firebase
        document.getElementById('prod-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('p-img').files[0];
            const reader = new FileReader();
            reader.onload = async function() {
                await addDoc(collection(db, "products"), {
                    title_bn: document.getElementById('p-name').value,
                    price: Number(document.getElementById('p-price').value),
                    image: reader.result
                });
                alert("প্রোডাক্ট সফলভাবে যুক্ত হয়েছে!");
                e.target.reset();
            };
            reader.readAsDataURL(file);
        });

        // Upload Banner to Firebase
        document.getElementById('banner-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('b-img').files[0];
            const reader = new FileReader();
            reader.onload = async function() {
                await addDoc(collection(db, "banners"), {
                    title: document.getElementById('b-title').value,
                    image: reader.result
                });
                alert("স্লাইডার ব্যানার যুক্ত হয়েছে!");
                e.target.reset();
            };
            reader.readAsDataURL(file);
        });

        // Live Read & Delete Products
        onSnapshot(collection(db, "products"), (snap) => {
            const list = document.getElementById('all-products-list');
            list.innerHTML = '';
            if(snap.empty) { list.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">কোনো প্রোডাক্ট পাওয়া যায়নি!</p>'; return; }
            snap.forEach(d => {
                const p = d.data();
                list.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            <img src="${p.image}" class="item-img">
                            <div>
                                <strong style="display:block; font-size:14px;">${p.title_bn}</strong>
                                <span style="font-size:12px; color:var(--primary); font-weight:bold;">৳${p.price}</span>
                            </div>
                        </div>
                        <button class="btn-delete" onclick="deleteItem('products', '${d.id}')"><i class="fa-solid fa-trash-can"></i> Delete</button>
                    </div>
                `;
            });
        });

        // Live Read & Delete Banners
        onSnapshot(collection(db, "banners"), (snap) => {
            const list = document.getElementById('all-banners-list');
            list.innerHTML = '';
            if(snap.empty) { list.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">কোনো ব্যানার পাওয়া যায়নি!</p>'; return; }
            snap.forEach(d => {
                const b = d.data();
                list.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            <img src="${b.image}" class="item-img" style="width:70px;">
                            <span style="font-size:13px;">${b.title || 'Slide Banner'}</span>
                        </div>
                        <button class="btn-delete" onclick="deleteItem('banners', '${d.id}')"><i class="fa-solid fa-trash-can"></i> Delete</button>
                    </div>
                `;
            });
        });

        window.deleteItem = async (col, id) => {
            if(confirm("আপনি কি নিশ্চিত এটি মুছতে চান?")) {
                await deleteDoc(doc(db, col, id));
            }
        };
    </script>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function checkAuth() {
            if(document.getElementById('admin-user').value === 'Admin' && document.getElementById('admin-pass').value === 'tTtTahsin26') {
                document.getElementById('login-overlay').style.display = 'none';
                sessionStorage.setItem('admin_logged', 'true');
            } else alert("ভুল ইউজারনেম বা পাসওয়ার্ড!");
        }

        function logout() { sessionStorage.removeItem('admin_logged'); location.reload(); }
        if(sessionStorage.getItem('admin_logged') === 'true') { document.getElementById('login-overlay').style.display = 'none'; }
    </script>
</body>
</html>
