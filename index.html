<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASYMART BD - Digital Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg-dark: #0f172a;
            --glass-card: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100;
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto; padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 22px; font-weight: 800; color: white; text-decoration: none; }
        .logo span { color: var(--primary); }

        .auth-btns { display: flex; gap: 10px; align-items: center; }
        .btn-auth {
            background: var(--primary); color: white; border: none; padding: 8px 18px;
            border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .user-profile { display: none; align-items: center; gap: 10px; color: var(--text-main); font-weight: 600; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; flex: 1; }

        /* Product Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card {
            background: var(--glass-card); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-img { width: 100%; height: 160px; border-radius: 12px; object-fit: cover; background: #1e293b; }
        .product-title { font-size: 16px; font-weight: 700; margin: 12px 0 6px; }
        .product-price { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 12px; }
        .btn-buy {
            width: 100%; padding: 10px; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-weight: 700; cursor: pointer;
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: #1e293b; border: 1px solid var(--glass-border);
            padding: 28px; border-radius: 20px; width: 90%; max-width: 400px; position: relative;
        }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 20px; cursor: pointer; color: var(--text-muted); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 10px 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border); border-radius: 10px; color: white; outline: none;
        }

        .tab-toggle { display: flex; margin-bottom: 20px; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 4px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }

        .payment-methods { display: flex; gap: 10px; margin: 10px 0; }
        .payment-card { flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; text-align: center; font-size: 13px; font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">EASYMART <span>BD</span></a>
            <div class="auth-btns">
                <button class="btn-auth" id="open-auth-modal" onclick="showAuthModal('login')">Sign In / Sign Up</button>
                <div class="user-profile" id="user-profile">
                    <span id="user-name">User</span>
                    <button class="btn-auth" style="background:#ef4444;" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <h2>উপলব্ধ প্রোডাক্টসমূহ</h2>
        <div class="products-grid" id="products-container">
            <p style="color:var(--text-muted)">প্রোডাক্ট লোড হচ্ছে...</p>
        </div>
    </div>

    <div class="modal-overlay" id="auth-modal">
        <div class="modal-box">
            <span class="close-btn" onclick="hideModal('auth-modal')">&times;</span>
            <div class="tab-toggle">
                <button class="tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
                <button class="tab-btn" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <form id="form-login">
                <div class="form-group"><label>Email</label><input type="email" id="login-email" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="login-pass" required></div>
                <button type="submit" class="btn-buy">Sign In</button>
            </form>

            <form id="form-signup" style="display:none;">
                <div class="form-group"><label>Full Name</label><input type="text" id="signup-name" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="signup-email" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="signup-pass" required></div>
                <button type="submit" class="btn-buy">Create Account</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-box">
            <span class="close-btn" onclick="hideModal('checkout-modal')">&times;</span>
            <h3 style="margin-bottom:12px;">Order Checkout</h3>
            <p id="checkout-prod-name" style="color:var(--primary); font-weight:bold;"></p>
            <p id="checkout-prod-price" style="margin-bottom:15px; font-weight:bold;"></p>

            <div class="payment-methods">
                <div class="payment-card" style="color:#e2136e;">bKash<br><small>01700000000</small></div>
                <div class="payment-card" style="color:#f7921e;">Nagad<br><small>01700000000</small></div>
            </div>

            <form id="form-checkout">
                <input type="hidden" id="ord-prod-id">
                <div class="form-group"><label>আপনার নাম</label><input type="text" id="ord-name" required></div>
                <div class="form-group"><label>মোবাইল নম্বর</label><input type="text" id="ord-phone" required></div>
                <div class="form-group"><label>bKash / Nagad Transaction ID (TrxID)</label><input type="text" id="ord-trx" required></div>
                <button type="submit" class="btn-buy">অর্ডার সাবমিট করুন</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnrZ8ZF8tGW2R5buFDsAeLHJlWHBwb9hw",
            authDomain: "easy-mart-bd-16b7b.firebaseapp.com",
            databaseURL: "https://easy-mart-bd-16b7b-default-rtdb.firebaseio.com",
            projectId: "easy-mart-bd-16b7b",
            storageBucket: "easy-mart-bd-16b7b.firebasestorage.app",
            messagingSenderId: "421957488158",
            appId: "1:421957488158:web:7d20d1f557ac6b06c9280f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Auth Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('open-auth-modal').style.display = 'none';
                document.getElementById('user-profile').style.display = 'flex';
                document.getElementById('user-name').innerText = user.displayName || user.email.split('@')[0];
            } else {
                currentUser = null;
                document.getElementById('open-auth-modal').style.display = 'block';
                document.getElementById('user-profile').style.display = 'none';
            }
        });

        // Sign Up System
        document.getElementById('form-signup').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-pass').value;

            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(res.user, { displayName: name });
                alert("অ্যাকাউন্ট তৈরি সফল হয়েছে!");
                window.hideModal('auth-modal');
            } catch (err) {
                alert("Sign Up Error: " + err.message);
            }
        });

        // Sign In System
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                alert("সাইন-ইন সফল হয়েছে!");
                window.hideModal('auth-modal');
            } catch (err) {
                alert("Sign In Error: " + err.message);
            }
        });

        // Logout System
        window.handleLogout = () => {
            signOut(auth).then(() => alert("লগআউট করা হয়েছে!"));
        };

        // Realtime Products Load
        onSnapshot(collection(db, "products"), (snap) => {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            if (snap.empty) {
                container.innerHTML = '<p style="color:var(--text-muted)">কোনো প্রোডাক্ট নেই। অ্যাডমিন প্যানেল থেকে অ্যাড করুন।</p>';
                return;
            }

            snap.forEach(docSnap => {
                const p = docSnap.data();
                container.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${p.image || ''}" class="product-img" alt="${p.title_bn}">
                            <div class="product-title">${p.title_bn}</div>
                            <div class="product-price">৳${p.price}</div>
                        </div>
                        <button class="btn-buy" onclick="initiateBuy('${p.title_bn}', '${p.price}')">Buy Now</button>
                    </div>
                `;
            });
        });

        // Order Trigger
        window.initiateBuy = (title, price) => {
            if (!currentUser) {
                alert("অর্ডার করার জন্য আপনাকে আগে Sign In অথবা Sign Up করতে হবে!");
                window.showAuthModal('login');
                return;
            }
            document.getElementById('checkout-prod-name').innerText = title;
            document.getElementById('checkout-prod-price').innerText = "মূল্য: ৳" + price;
            document.getElementById('checkout-modal').style.display = 'flex';
        };

        // Order Submit
        document.getElementById('form-checkout').addEventListener('submit', async (e) => {
            e.preventDefault();
            const orderData = {
                customerName: document.getElementById('ord-name').value,
                phone: document.getElementById('ord-phone').value,
                trxId: document.getElementById('ord-trx').value,
                product: document.getElementById('checkout-prod-name').innerText,
                total: document.getElementById('checkout-prod-price').innerText,
                userId: currentUser.uid,
                userEmail: currentUser.email,
                createdAt: new Date().toISOString()
            };

            await addDoc(collection(db, "orders"), orderData);
            alert("অর্ডার প্লেস করা হয়েছে! পেমেন্ট ভেরিফাই করে ডেলিভারি দেওয়া হবে।");
            window.hideModal('checkout-modal');
            e.target.reset();
        });
    </script>

    <script>
        window.showAuthModal = function(type) {
            document.getElementById('auth-modal').style.display = 'flex';
            window.switchAuthTab(type);
        }

        window.hideModal = function(id) {
            document.getElementById(id).style.display = 'none';
        }

        window.switchAuthTab = function(tab) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }
    </script>
</body>
</html>
