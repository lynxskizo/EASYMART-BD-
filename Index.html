<!DOCTYPE html>
 lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title-tag">EASYMART BD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style id="theme-style">
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --font-bn: 'Hind Siliguri', sans-serif;
            --font-en: 'Inter', sans-serif;
            --bg-color: #1a0f0a;
            --card-bg: rgba(255, 255, 255, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 24px 24px;
            color: #f8fafc;
            font-family: var(--font-bn);
            line-height: 1.5;
            min-height: 100vh;
        }

        body.lang-en { font-family: var(--font-en); }

        header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0; z-index: 100;
            padding: 15px 5%; display: flex;
            justify-content: space-between; align-items: center;
        }

        .logo { font-size: 22px; font-weight: 700; color: #ffffff; font-family: var(--font-en); }
        .logo span { color: var(--primary); }

        .search-container { position: relative; flex: 0 1 300px; margin: 0 15px; }
        .search-container input {
            width: 100%; padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px; color: #fff; outline: none; font-size: 14px;
        }

        .nav-actions { display: flex; gap: 12px; align-items: center; }
        .btn-auth { background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 13px; cursor: pointer; }
        .lang-switch { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px 14px; border-radius: 20px; cursor: pointer; color: #fff; font-size: 13px; }

        .hero { padding: 50px 20px; text-align: center; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }

        .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }

        .grid-products { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; padding: 16px; transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .card-category { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
        .card-price { color: var(--primary); font-weight: 700; font-size: 16px; margin-bottom: 12px; }

        .btn-card { width: 100%; padding: 9px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.15); padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #cbd5e1; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: white; }

        footer { border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center; padding: 20px; color: #64748b; font-size: 14px; margin-top: 40px; }
        .lang-en-text { display: none; }
        body.lang-en .lang-bn-text { display: none; }
        body.lang-en .lang-en-text { display: inline-block; }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="site-logo">EASYMART <span>BD</span></div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="সার্চ করুন..." onkeyup="searchProducts()">
        </div>

        <div class="nav-actions">
            <button id="auth-btn" class="btn-auth">Login</button>
            <button class="lang-switch" onclick="toggleLanguage()">
                <span class="lang-bn-text">English</span>
                <span class="lang-en-text">বাংলা</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <h1 id="hero-banner-text">আপনার প্রয়োজনীয় সব কেনাকাটা এক জায়গায়</h1>
    </section>

    <div class="container">
        <h2 class="section-title">
            <span class="lang-bn-text">লেটেস্ট প্রোডাক্টস</span>
            <span class="lang-en-text">Latest Products</span>
        </h2>
        <div id="product-list" class="grid-products">
            <p style="color: #94a3b8;">লোড হচ্ছে...</p>
        </div>
    </div>

    <div id="order-modal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3>অর্ডার কনফার্ম করুন</h3>
                <span style="cursor:pointer;" onclick="closeModal()">✕</span>
            </div>
            <form id="checkout-form">
                <input type="hidden" id="order-prod-title">
                <input type="hidden" id="order-prod-price">
                <div class="form-group">
                    <label>আপনার নাম</label>
                    <input type="text" id="cust-name" required>
                </div>
                <div class="form-group">
                    <label>মোবাইল নম্বর</label>
                    <input type="tel" id="cust-phone" required>
                </div>
                <div class="form-group">
                    <label>ঠিকানা</label>
                    <input type="text" id="cust-address" required>
                </div>
                <div class="form-group">
                    <label>পেমেন্ট মেথড</label>
                    <select id="payment-method" style="color:#000;">
                        <option value="Cash on Delivery">ক্যাশ অন ডেলিভারি (COD)</option>
                        <option value="bKash">বিকাশ (Send Money)</option>
                        <option value="Nagad">নগদ (Send Money)</option>
                    </select>
                </div>
                <button type="submit" class="btn-card" style="margin-top:10px;">সাবমিট করুন</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; ২০২৬ EASYMART BD. All Rights Reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnrZ8ZF8tGW2R5buFDsAeLHJlWHBwb9hw",
            authDomain: "easy-mart-bd-16b7b.firebaseapp.com",
            databaseURL: "https://easy-mart-bd-16b7b-default-rtdb.firebaseio.com",
            projectId: "easy-mart-bd-16b7b",
            storageBucket: "easy-mart-bd-16b7b.firebasestorage.app",
            messagingSenderId: "421957488158",
            appId: "1:421957488158:web:7d20d1f557ac6b06c9280f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentUser = null;

        // Load Settings
        onSnapshot(doc(db, "settings", "site_config"), (docSnap) => {
            if(docSnap.exists()) {
                const cfg = docSnap.data();
                if(cfg.site_name) {
                    document.getElementById('site-logo').innerHTML = cfg.site_name;
                    document.getElementById('site-title-tag').innerText = cfg.site_name;
                }
                if(cfg.hero_banner) document.getElementById('hero-banner-text').innerText = cfg.hero_banner;
            }
        });

        // Auth
        const authBtn = document.getElementById('auth-btn');
        authBtn.onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            authBtn.innerText = user ? 'Logout' : 'Login';
            authBtn.onclick = () => user ? signOut(auth) : signInWithPopup(auth, new GoogleAuthProvider());
        });

        // Load Products
        const prodList = document.getElementById('product-list');
        onSnapshot(collection(db, "products"), (snapshot) => {
            prodList.innerHTML = '';
            if(snapshot.empty) {
                prodList.innerHTML = '<p style="color:#94a3b8;">কোনো প্রোডাক্ট পাওয়া যায়নি</p>';
                return;
            }
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                prodList.innerHTML += `
                    <div class="card" data-title="${(data.title_bn || '') + ' ' + (data.title_en || '')}">
                        <img src="${data.image || 'https://via.placeholder.com/150'}" alt="Product">
                        <div class="card-title">
                            <span class="lang-bn-text">${data.title_bn || ''}</span>
                            <span class="lang-en-text">${data.title_en || data.title_bn || ''}</span>
                        </div>
                        <div class="card-category">${data.category || 'General'}</div>
                        <div class="card-price">৳${data.price || '0'}</div>
                        <button class="btn-card" onclick="openOrderModal('${data.title_bn}', '${data.price}')">
                            <span class="lang-bn-text">অর্ডার করুন</span>
                            <span class="lang-en-text">Order Now</span>
                        </button>
                    </div>
                `;
            });
        });

        // Checkout Submit
        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, "orders"), {
                    product: document.getElementById('order-prod-title').value,
                    price: document.getElementById('order-prod-price').value,
                    customer_name: document.getElementById('cust-name').value,
                    phone: document.getElementById('cust-phone').value,
                    address: document.getElementById('cust-address').value,
                    payment: document.getElementById('payment-method').value,
                    user_email: currentUser ? currentUser.email : 'Guest',
                    date: new Date().toLocaleString()
                });
                alert('আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে!');
                window.closeModal();
                e.target.reset();
            } catch(err) { alert(err.message); }
        });

        window.openOrderModal = (title, price) => {
            document.getElementById('order-prod-title').value = title;
            document.getElementById('order-prod-price').value = price;
            document.getElementById('order-modal').style.display = 'flex';
        };
        window.closeModal = () => document.getElementById('order-modal').style.display = 'none';
    </script>

    <script>
        function toggleLanguage() { document.body.classList.toggle('lang-en'); }
        function searchProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                const title = card.getAttribute('data-title').toLowerCase();
                card.style.display = title.includes(query) ? "block" : "none";
            });
        }
    </script>
</body>
        </html>
