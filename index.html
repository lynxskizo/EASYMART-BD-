<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASYMART BD - Apple Glass Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.45);
            --bg-dark: #080c14;
            /* Premium Apple Glass Styles */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-card: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-modal: rgba(13, 19, 33, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        body { 
            background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 75px; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Apple Glass Header */
        header {
            background: rgba(8, 12, 20, 0.55);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
        }
        
        /* Interactive Glass Buttons */
        .icon-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: white; width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            font-size: 16px; position: relative;
        }
        .icon-btn:hover, .icon-btn:active { 
            background: rgba(255,255,255,0.18); 
            border-color: var(--primary); 
            transform: translateY(-2px) scale(1.05); 
            box-shadow: 0 0 20px var(--primary-glow); 
        }
        
        .badge {
            position: absolute; top: -3px; right: -3px; background: var(--primary);
            color: white; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 10px;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .logo { font-size: 18px; font-weight: 800; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo-icon { background: var(--primary); color: white; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 0 15px var(--primary-glow); }

        .container { max-width: 1200px; margin: 16px auto; padding: 0 16px; flex: 1; }

        /* Glass Search Bar */
        .search-box { position: relative; margin-bottom: 16px; }
        .search-box input {
            width: 100%; padding: 12px 16px 12px 42px; background: var(--glass-card);
            border: 1px solid var(--glass-border); border-radius: 18px;
            color: white; outline: none; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 14px;
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); background: rgba(255,255,255,0.1); }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* Banner Slider Glass */
        .banner-slider {
            width: 100%; height: 160px; background: var(--glass-card);
            border: 1px solid var(--glass-border); border-radius: 22px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main); font-weight: 600; margin-bottom: 20px;
            position: relative; overflow: hidden; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Glass Categories Chips */
        .category-chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none; }
        .chip {
            background: var(--glass-card); border: 1px solid var(--glass-border);
            padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
            white-space: nowrap; cursor: pointer; color: var(--text-muted); backdrop-filter: blur(16px);
        }
        .chip.active, .chip:hover { 
            background: var(--primary); color: white; border-color: var(--primary); 
            box-shadow: 0 4px 20px var(--primary-glow); transform: translateY(-2px);
        }

        /* Glass Product Cards Animation */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .product-card {
            background: var(--glass-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 22px; padding: 12px;
            display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }
        .product-card:hover { 
            transform: translateY(-6px) scale(1.02); 
            border-color: rgba(16, 185, 129, 0.5); 
            box-shadow: 0 12px 30px var(--primary-glow); 
        }
        .product-img { width: 100%; height: 120px; border-radius: 14px; object-fit: cover; background: rgba(255,255,255,0.03); }
        .product-title { font-size: 14px; font-weight: 700; margin: 10px 0 4px; }
        .product-price { font-size: 16px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
        
        .btn-glass-action {
            width: 100%; padding: 10px; background: var(--primary); color: white;
            border: none; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 13px;
            box-shadow: 0 4px 15px var(--primary-glow);
        }
        .btn-glass-action:hover { transform: scale(1.03); background: #059669; }

        /* Glass Drawer Side Menu */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: none; z-index: 999;
        }
        .drawer {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background: rgba(13, 19, 33, 0.85); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid var(--glass-border); z-index: 1000;
            padding: 20px; transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column;
        }
        .drawer.open { left: 0; }
        .drawer-tabs { display: flex; border-bottom: 1px solid var(--glass-border); margin-bottom: 16px; }
        .drawer-tab { flex: 1; padding: 10px; background: none; border: none; color: var(--text-muted); font-weight: 700; cursor: pointer; text-align: center; }
        .drawer-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .drawer-menu-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-main); text-decoration: none; font-size: 14px; font-weight: 600; border-radius: 12px; margin-bottom: 4px; }
        .drawer-menu-item:hover { background: var(--glass-card); color: var(--primary); transform: translateX(5px); }

        /* Bottom Glass Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(8, 12, 20, 0.65); backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%);
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 99;
        }
        .nav-item { color: var(--text-muted); text-align: center; font-size: 11px; text-decoration: none; cursor: pointer; background: none; border: none; }
        .nav-item.active, .nav-item:hover { color: var(--primary); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 2px; }

        /* Glass Modal Popup */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: none; justify-content: center; align-items: center; z-index: 1001; animation: fadeIn 0.3s ease;
        }
        .modal-box {
            background: var(--glass-modal); border: 1px solid var(--glass-border);
            padding: 26px; border-radius: 26px; width: 90%; max-width: 360px; position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .close-btn { position: absolute; top: 16px; right: 20px; font-size: 22px; cursor: pointer; color: var(--text-muted); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .form-group input {
            width: 100%; padding: 11px 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border); border-radius: 12px; color: white; outline: none; font-size: 13px;
        }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .tab-toggle { display: flex; margin-bottom: 16px; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 4px; }
        .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; cursor: pointer; border-radius: 8px; font-size: 13px; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 10px var(--primary-glow); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <button class="icon-btn" onclick="toggleDrawer()"><i class="fa-solid fa-bars"></i></button>
            <a href="#" class="logo"><div class="logo-icon"><i class="fa-solid fa-bolt"></i></div> EASYMART <span>BD</span></a>
            <div style="display:flex; gap:8px;">
                <button class="icon-btn" onclick="toggleLanguage()"><i class="fa-solid fa-globe"></i></button>
                <button class="icon-btn" onclick="openModal('auth-modal')" id="header-user-btn"><i class="fa-regular fa-user"></i></button>
                <button class="icon-btn"><i class="fa-solid fa-cart-shopping"></i><span class="badge">0</span></button>
            </div>
        </div>
    </header>

    <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-tabs">
            <button class="drawer-tab active" id="drawer-tab-cat" onclick="switchDrawerTab('cat')">Category</button>
            <button class="drawer-tab" id="drawer-tab-menu" onclick="switchDrawerTab('menu')">Menu</button>
        </div>
        
        <div id="drawer-cat-content">
            <a href="#" class="drawer-menu-item"><i class="fa-solid fa-robot"></i> AI Subscriptions</a>
            <a href="#" class="drawer-menu-item"><i class="fa-solid fa-tv"></i> Streaming</a>
            <a href="#" class="drawer-menu-item"><i class="fa-solid fa-shield-halved"></i> VPN & Security</a>
            <a href="#" class="drawer-menu-item"><i class="fa-solid fa-gamepad"></i> Game Top-ups</a>
        </div>

        <div id="drawer-menu-content" style="display:none;">
            <a href="#" class="drawer-menu-item"><i class="fa-solid fa-house"></i> Home</a>
            <a href="#" class="drawer-menu-item"><i class="fa-solid fa-border-all"></i> Catalog</a>
            <a href="#" class="drawer-menu-item"><i class="fa-solid fa-headset"></i> Support</a>
        </div>
    </div>

    <div class="container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search products...">
        </div>

        <div class="banner-slider">
            <i class="fa-regular fa-images" style="margin-right:8px;"></i> ব্যানার স্লাইডার (Banner Slider)
        </div>

        <div class="category-chips">
            <div class="chip active">All</div>
            <div class="chip">AI Subscriptions</div>
            <div class="chip">Streaming</div>
            <div class="chip">VPN & Security</div>
            <div class="chip">Game Top-ups</div>
        </div>

        <h3 style="font-size: 16px; margin-bottom: 12px;" id="prod-sec-title" data-key="available_products">উপলব্ধ প্রোডাক্টসমূহ</h3>
        <div class="products-grid" id="products-container">
            <p style="color:var(--text-muted)">প্রোডাক্ট লোড হচ্ছে...</p>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active"><i class="fa-solid fa-house"></i><span data-key="nav_home">Home</span></button>
        <button class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span data-key="nav_search">Search</span></button>
        <button class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span data-key="nav_cart">Cart</span></button>
        <button class="nav-item" onclick="openModal('auth-modal')"><i class="fa-regular fa-user"></i><span id="bottom-user-text" data-key="signin">Sign In</span></button>
    </div>

    <div class="modal-overlay" id="auth-modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal('auth-modal')">&times;</span>
            <div class="tab-toggle">
                <button class="tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
                <button class="tab-btn" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <form id="form-login">
                <div class="form-group"><label>Email</label><input type="email" id="login-email" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="login-pass" required></div>
                <button type="submit" class="btn-glass-action" style="margin-top:10px;">Sign In</button>
            </form>

            <form id="form-signup" style="display:none;">
                <div class="form-group"><label>Full Name</label><input type="text" id="signup-name" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="signup-email" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="signup-pass" required></div>
                <button type="submit" class="btn-glass-action" style="margin-top:10px;">Create Account</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal('checkout-modal')">&times;</span>
            <h3 style="margin-bottom:10px; font-size:16px;" data-key="checkout_title">অর্ডার চেকআউট</h3>
            <p id="checkout-prod-name" style="color:var(--primary); font-weight:bold; font-size:14px;"></p>
            <p id="checkout-prod-price" style="margin-bottom:12px; font-weight:bold; font-size:14px;"></p>

            <form id="form-checkout">
                <div class="form-group"><label data-key="your_name">আপনার নাম</label><input type="text" id="ord-name" required></div>
                <div class="form-group"><label data-key="phone_number">মোবাইল নম্বর</label><input type="text" id="ord-phone" required></div>
                <div class="form-group"><label>bKash / Nagad TrxID</label><input type="text" id="ord-trx" required></div>
                <button type="submit" class="btn-glass-action" style="margin-top:10px;" data-key="submit_order">অর্ডার সাবমিট করুন</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnrZ8ZF8tGW2R5buFDsAeLHJlWHBwb9hw",
            authDomain: "easy-mart-bd-16b7b.firebaseapp.com",
            databaseURL: "https://easy-mart-bd-16b7b-default-rtdb.firebaseio.com",
            projectId: "easy-mart-bd-16b7b",
            storageBucket: "easy-mart-bd-16b7b.firebasestorage.app",
            messagingSenderId: "421957488158",
            appId: "1:421957488158:web:7d20d1f557ac6b06c9280f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('bottom-user-text').innerText = 'Account';
            } else {
                currentUser = null;
                document.getElementById('bottom-user-text').innerText = 'Sign In';
            }
        });

        // Sign Up Handler
        document.getElementById('form-signup').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const name = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const pass = document.getElementById('signup-pass').value;

                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(res.user, { displayName: name });
                alert("Account created successfully!");
                closeModal('auth-modal');
            } catch (err) { alert("Sign Up Error: " + err.message); }
        });

        // Sign In Handler
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const email = document.getElementById('login-email').value;
                const pass = document.getElementById('login-pass').value;

                await signInWithEmailAndPassword(auth, email, pass);
                alert("Logged in successfully!");
                closeModal('auth-modal');
            } catch (err) { alert("Sign In Error: " + err.message); }
        });

        // Load Products in Realtime
        onSnapshot(collection(db, "products"), (snap) => {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            if (snap.empty) {
                container.innerHTML = '<p style="color:var(--text-muted)">কোনো প্রোডাক্ট নেই।</p>';
                return;
            }
            snap.forEach(docSnap => {
                const p = docSnap.data();
                container.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${p.image || ''}" class="product-img" alt="${p.title_bn}">
                            <div class="product-title">${p.title_bn}</div>
                            <div class="product-price">৳${p.price}</div>
                        </div>
                        <button class="btn-glass-action" onclick="buyProduct('${p.title_bn}', '${p.price}')">Buy Now</button>
                    </div>
                `;
            });
        });

        // Mandatory Auth for Order
        window.buyProduct = (title, price) => {
            if (!currentUser) {
                alert("অর্ডার করতে হলে আপনাকে প্রথমে Sign In করতে হবে!");
                openModal('auth-modal');
                return;
            }
            document.getElementById('checkout-prod-name').innerText = title;
            document.getElementById('checkout-prod-price').innerText = "Price: ৳" + price;
            openModal('checkout-modal');
        };

        // Submit Order to Firestore
        document.getElementById('form-checkout').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "orders"), {
                customerName: document.getElementById('ord-name').value,
                phone: document.getElementById('ord-phone').value,
                trxId: document.getElementById('ord-trx').value,
                product: document.getElementById('checkout-prod-name').innerText,
                total: document.getElementById('checkout-prod-price').innerText,
                userId: currentUser.uid,
                userEmail: currentUser.email,
                createdAt: new Date().toISOString()
            });
            alert("অর্ডার সফলভাবে প্লেস করা হয়েছে!");
            closeModal('checkout-modal');
            e.target.reset();
        });
    </script>

    <script>
        let currentLang = 'BN';

        const translations = {
            BN: {
                available_products: "উপলব্ধ প্রোডাক্টসমূহ",
                nav_home: "হোম",
                nav_search: "সার্চ",
                nav_cart: "কার্ট",
                signin: "Sign In",
                checkout_title: "অর্ডার চেকআউট",
                your_name: "আপনার নাম",
                phone_number: "মোবাইল নম্বর",
                submit_order: "অর্ডার সাবমিট করুন"
            },
            EN: {
                available_products: "Available Products",
                nav_home: "Home",
                nav_search: "Search",
                nav_cart: "Cart",
                signin: "Sign In",
                checkout_title: "Order Checkout",
                your_name: "Your Name",
                phone_number: "Phone Number",
                submit_order: "Submit Order"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'BN' ? 'EN' : 'BN';
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
        }

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('drawer-overlay');
            if (drawer.classList.contains('open')) {
                drawer.classList.remove('open');
                overlay.style.display = 'none';
            } else {
                drawer.classList.add('open');
                overlay.style.display = 'block';
            }
        }

        function switchDrawerTab(tab) {
            if (tab === 'cat') {
                document.getElementById('drawer-cat-content').style.display = 'block';
                document.getElementById('drawer-menu-content').style.display = 'none';
                document.getElementById('drawer-tab-cat').classList.add('active');
                document.getElementById('drawer-tab-menu').classList.remove('active');
            } else {
                document.getElementById('drawer-cat-content').style.display = 'none';
                document.getElementById('drawer-menu-content').style.display = 'block';
                document.getElementById('drawer-tab-menu').classList.add('active');
                document.getElementById('drawer-tab-cat').classList.remove('active');
            }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('form-signup').style.display = 'none';
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-signup').classList.remove('active');
            } else {
                document.getElementById('form-login').style.display = 'none';
                document.getElementById('form-signup').style.display = 'block';
                document.getElementById('tab-signup').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
            }
        }
    </script>
</body>
</html>
