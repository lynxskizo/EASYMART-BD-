<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASYMART Admin Console</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.45);
            --bg-dark: #080c14;
            --glass-card: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif; transition: all 0.25s ease; }
        
        body { 
            background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 20px;
            background-image: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .header { display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto 20px; }
        .title { font-size: 20px; font-weight: 800; color: white; display: flex; align-items: center; gap: 8px; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; }

        .admin-card {
            background: var(--glass-card); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 24px; max-width: 800px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .menu-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            color: var(--text-muted); padding: 14px; border-radius: 14px; text-align: left;
            font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px;
        }
        .menu-btn.active, .menu-btn:hover { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 15px var(--primary-glow); }

        .section-panel { display: none; }
        .section-panel.active { display: block; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        
        .form-group input, .custom-select {
            width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.06) !important;
            border: 1px solid var(--glass-border) !important; border-radius: 14px !important;
            color: white !important; outline: none; font-size: 14px !important;
        }

        .custom-select {
            cursor: pointer;
            -webkit-appearance: none; -moz-appearance: none; appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2310b981' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>") !important;
            background-repeat: no-repeat !important;
            background-position: right 14px center !important;
        }

        .custom-select option {
            background-color: #0d1321 !important;
            color: #ffffff !important;
            padding: 12px;
        }

        .form-group input:focus, .custom-select:focus { border-color: var(--primary) !important; box-shadow: 0 0 15px var(--primary-glow) !important; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

        .submit-btn {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 14px; font-weight: 700; font-size: 15px;
            cursor: pointer; box-shadow: 0 4px 15px var(--primary-glow); margin-top: 10px;
        }
        .submit-btn:hover { background: #059669; }

        .order-card, .cat-item { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title"><i class="fa-solid fa-shield-halved" style="color:var(--primary)"></i> EASYMART Admin Console</div>
        <button class="logout-btn" id="btn-logout">Logout</button>
    </div>

    <div class="admin-card">
        <div class="menu-grid">
            <button class="menu-btn active" onclick="switchTab('products', this)"><i class="fa-solid fa-box"></i> Manage Products</button>
            <button class="menu-btn" onclick="switchTab('categories', this)"><i class="fa-solid fa-layer-group"></i> Manage Categories</button>
            <button class="menu-btn" onclick="switchTab('banners', this)"><i class="fa-solid fa-images"></i> Manage Banners</button>
            <button class="menu-btn" onclick="switchTab('orders', this)"><i class="fa-solid fa-cart-shopping"></i> Customer Orders</button>
        </div>

        <div id="panel-products" class="section-panel active">
            <form id="product-form">
                <h3 style="margin-bottom: 16px; font-size: 16px;">নতুন প্রোডাক্ট যোগ করুন</h3>

                <div class="form-group">
                    <label>পণ্যের নাম</label>
                    <input type="text" id="prod-title" placeholder="যেমন: ChatGPT Plus" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>মূল্য (৳)</label>
                        <input type="number" id="prod-price" placeholder="2750" required>
                    </div>
                    <div class="form-group">
                        <label>ডিসকাউন্ট (%)</label>
                        <input type="number" id="prod-discount" value="0">
                    </div>
                    <div class="form-group">
                        <label>ক্যাটাগরি</label>
                        <select id="prod-category" class="custom-select" required>
                            <option value="" disabled selected>ক্যাটাগরি সিলেক্ট করুন</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>ছবি ফাইল (অপশনাল)</label>
                    <input type="file" id="prod-image-file" accept="image/*">
                </div>

                <button type="submit" class="submit-btn" id="btn-upload">প্রোডাক্ট আপলোড করুন</button>
            </form>
        </div>

        <div id="panel-categories" class="section-panel">
            <h3 style="margin-bottom: 16px; font-size: 16px;">নতুন ক্যাটাগরি যোগ করুন</h3>
            <div class="form-group">
                <label>ক্যাটাগরির নাম</label>
                <input type="text" id="cat-title" placeholder="যেমন: AI Subscriptions">
            </div>
            <button class="submit-btn" onclick="addNewCategory()">ক্যাটাগরি সেভ করুন</button>
        </div>

        <div id="panel-banners" class="section-panel">
            <h3 style="margin-bottom: 16px; font-size: 16px;">ব্যনার আপলোড</h3>
            <div class="form-group">
                <label>ব্যনার ইমেজ ফাইল</label>
                <input type="file" id="banner-file" accept="image/*">
            </div>
            <button class="submit-btn" onclick="uploadBanner()">ব্যনার সেট করুন</button>
        </div>

        <div id="panel-orders" class="section-panel">
            <h3 style="margin-bottom: 16px; font-size: 16px;">গ্রাহকদের সাম্প্রতিক অর্ডারসমূহ</h3>
            <div id="orders-list-container">
                <p style="color:var(--text-muted)">অর্ডার লোড হচ্ছে...</p>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnrZ8ZF8tGW2R5buFDsAeLHJlWHBwb9hw",
            authDomain: "easy-mart-bd-16b7b.firebaseapp.com",
            databaseURL: "https://easy-mart-bd-16b7b-default-rtdb.firebaseio.com",
            projectId: "easy-mart-bd-16b7b",
            storageBucket: "easy-mart-bd-16b7b.firebasestorage.app",
            messagingSenderId: "421957488158",
            appId: "1:421957488158:web:7d20d1f557ac6b06c9280f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // গ্লোবাল ফাংশন: মেনু ট্যাব সুইচিং (১০০% কাজ করবে)
        window.switchTab = function(panelName, btnElement) {
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));

            btnElement.classList.add('active');
            document.getElementById(`panel-${panelName}`).classList.add('active');
        };

        // লগআউট বাটন
        document.getElementById('btn-logout').addEventListener('click', () => {
            alert("Logged out successfully!");
            window.location.href = "index.html";
        });

        // ডিফল্ট ক্যাটাগরি লিস্ট
        const defaultCategories = [
            "AI Subscriptions", "Streaming", "Software", "Gift card", 
            "Game top-ups", "Google service", "Education", 
            "Design & creative", "VPN & security", "WordPress tools", "Marketing tools"
        ];

        // ক্যাটাগরি লোড করার ফাংশন
        function loadCategories() {
            const selectEl = document.getElementById('prod-category');
            
            onSnapshot(collection(db, "categories"), (snapshot) => {
                selectEl.innerHTML = '<option value="" disabled selected>ক্যাটাগরি সিলেক্ট করুন</option>';
                let count = 0;

                snapshot.forEach((doc) => {
                    count++;
                    const catName = doc.data().name || doc.data().title || doc.id;
                    selectEl.innerHTML += `<option value="${catName}">${catName}</option>`;
                });

                if (count === 0) {
                    defaultCategories.forEach(cat => {
                        selectEl.innerHTML += `<option value="${cat}">${cat}</option>`;
                    });
                }
            }, () => {
                selectEl.innerHTML = '<option value="" disabled selected>ক্যাটাগরি সিলেক্ট করুন</option>';
                defaultCategories.forEach(cat => {
                    selectEl.innerHTML += `<option value="${cat}">${cat}</option>`;
                });
            });
        }
        loadCategories();

        // নতুন প্রোডাক্ট আপলোড
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-upload');
            btn.innerText = "আপলোড হচ্ছে...";
            btn.disabled = true;

            try {
                const title = document.getElementById('prod-title').value;
                const price = parseFloat(document.getElementById('prod-price').value);
                const discount = parseFloat(document.getElementById('prod-discount').value) || 0;
                const category = document.getElementById('prod-category').value;
                const file = document.getElementById('prod-image-file').files[0];

                let imageUrl = "";

                if (file) {
                    const storageRef = ref(storage, `products/${Date.now()}_${file.name}`);
                    await uploadBytes(storageRef, file);
                    imageUrl = await getDownloadURL(storageRef);
                }

                await addDoc(collection(db, "products"), {
                    title_bn: title,
                    price: price,
                    discount: discount,
                    category: category,
                    image: imageUrl,
                    createdAt: new Date().toISOString()
                });

                alert("প্রোডাক্ট সফলভাবে আপলোড হয়েছে!");
                e.target.reset();
            } catch (err) {
                alert("Upload Error: " + err.message);
            } finally {
                btn.innerText = "প্রোডাক্ট আপলোড করুন";
                btn.disabled = false;
            }
        });

        // নতুন ক্যাটাগরি সেভ
        window.addNewCategory = async function() {
            const catName = document.getElementById('cat-title').value;
            if(!catName) { alert("ক্যাটাগরির নাম দিন!"); return; }

            await addDoc(collection(db, "categories"), { name: catName });
            alert("ক্যাটাগরি যুক্ত করা হয়েছে!");
            document.getElementById('cat-title').value = "";
        };

        // ব্যনার আপলোড
        window.uploadBanner = async function() {
            const file = document.getElementById('banner-file').files[0];
            if(!file) { alert("একটি ইমেজ সিলেক্ট করুন!"); return; }

            const storageRef = ref(storage, `banners/${Date.now()}_${file.name}`);
            await uploadBytes(storageRef, file);
            const bannerUrl = await getDownloadURL(storageRef);

            await addDoc(collection(db, "banners"), { url: bannerUrl, createdAt: new Date().toISOString() });
            alert("ব্যনার সেট হয়েছে!");
        };

        // অর্ডার লিস্ট রিয়েলটাইম লোড
        onSnapshot(collection(db, "orders"), (snapshot) => {
            const container = document.getElementById('orders-list-container');
            container.innerHTML = "";
            
            if(snapshot.empty) {
                container.innerHTML = "<p style='color:var(--text-muted)'>কোনো অর্ডার পাওয়া যায়নি।</p>";
                return;
            }

            snapshot.forEach(docSnap => {
                const ord = docSnap.data();
                container.innerHTML += `
                    <div class="order-card">
                        <div style="font-weight:bold; color:var(--primary);">${ord.product || 'Product'}</div>
                        <div style="font-size:12px;">Customer: ${ord.customerName} (${ord.phone})</div>
                        <div style="font-size:12px;">Total: ৳${ord.total} | Payment: ${ord.paymentMethod}</div>
                        <div style="font-size:11px; color:var(--text-muted);">TrxID: ${ord.trxId}</div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
