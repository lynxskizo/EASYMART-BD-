<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">EASYMART BD - Premium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-card: rgba(30, 41, 59, 0.5);
            --bg-color: #0b0f19;
            --text-color: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-color); color: var(--text-color); font-family: 'Hind Siliguri', 'Inter', sans-serif; overflow-x: hidden; min-height: 100vh; }

        /* Glass Header */
        header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(11, 15, 25, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border); padding: 12px 5%;
            display: flex; justify-content: space-between; align-items: center; gap: 15px;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
        .logo { font-size: 22px; font-weight: 800; font-family: 'Inter', sans-serif; color: #fff; cursor: pointer; }
        .logo span { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }

        .search-bar { flex: 1; max-width: 450px; position: relative; }
        .search-bar input {
            width: 100%; padding: 10px 18px; background: var(--glass-bg);
            border: 1px solid var(--glass-border); border-radius: 30px; color: white; outline: none; font-size: 14px;
        }
        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .header-right { display: flex; align-items: center; gap: 15px; }
        .cart-icon-btn { position: relative; background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 8px 12px; border-radius: 20px; cursor: pointer; color: white; }
        .cart-count { position: absolute; top: -6px; right: -6px; background: #ef4444; color: white; font-size: 11px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* User Profile Dropdown */
        .user-menu { position: relative; }
        .btn-auth { background: var(--primary); border: none; padding: 8px 16px; border-radius: 20px; color: white; font-weight: 600; cursor: pointer; }
        .btn-auth:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--primary-glow); }

        /* Slide Menu (Mobile Drawer) */
        .side-drawer {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border-right: 1px solid var(--glass-border);
            z-index: 2000; padding: 25px 20px; display: flex; flex-direction: column; gap: 20px;
        }
        .side-drawer.active { left: 0; }
        .drawer-close { align-self: flex-end; background: none; border: none; color: white; font-size: 20px; cursor: pointer; }

        /* Slide Cart Drawer */
        .cart-drawer {
            position: fixed; top: 0; right: -380px; width: 350px; height: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(25px); border-left: 1px solid var(--glass-border);
            z-index: 2000; padding: 25px; display: flex; flex-direction: column;
        }
        .cart-drawer.active { right: 0; }
        .cart-items { flex: 1; overflow-y: auto; margin: 20px 0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--glass-bg); padding: 10px; border-radius: 8px; margin-bottom: 10px; }

        /* Hero Banner & Layout */
        .hero { text-align: center; padding: 60px 20px; background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15), transparent 70%); }
        .hero h1 { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }

        /* Glass Product Cards */
        .card {
            background: var(--glass-card); backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 15px; position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .card-price { color: var(--primary); font-size: 18px; font-weight: 700; margin-bottom: 12px; }

        .btn-action { width: 100%; padding: 10px; background: var(--primary); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; }
        .btn-action:hover { opacity: 0.9; }

        /* Glass Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); justify-content: center; align-items: center; z-index: 3000; }
        .modal-box { background: rgba(30, 41, 59, 0.9); border: 1px solid var(--glass-border); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #cbd5e1; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 8px; color: white; outline: none; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-btn" onclick="toggleDrawer('side-drawer')">☰</button>
            <div class="logo" id="site-logo">EASYMART <span>BD</span></div>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="পছন্দের পণ্য সার্চ করুন..." onkeyup="searchProducts()">
        </div>

        <div class="header-right">
            <button class="cart-icon-btn" onclick="toggleDrawer('cart-drawer')">
                🛒 Cart <span class="cart-count" id="cart-count">0</span>
            </button>
            <div class="user-menu">
                <button id="auth-btn" class="btn-auth" onclick="openAuthModal()">Login / Sign Up</button>
            </div>
        </div>
    </header>

    <div class="side-drawer" id="side-drawer">
        <button class="drawer-close" onclick="toggleDrawer('side-drawer')">✕</button>
        <h2>Menu</h2>
        <a href="#" style="color:white; text-decoration:none;">Home</a>
        <a href="#products" style="color:white; text-decoration:none;">All Products</a>
        <a href="#categories" style="color:white; text-decoration:none;">Categories</a>
    </div>

    <div class="cart-drawer" id="cart-drawer">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Your Cart</h3>
            <button class="drawer-close" onclick="toggleDrawer('cart-drawer')">✕</button>
        </div>
        <div class="cart-items" id="cart-items">
            <p style="color:#94a3b8;">কার্ট খালি রয়েছে</p>
        </div>
        <button class="btn-action" onclick="openCheckoutFromCart()">Checkout Now</button>
    </div>

    <section class="hero">
        <h1 id="hero-banner-text">আপনার প্রয়োজনীয় সব কেনাকাটা এক জায়গায়</h1>
    </section>

    <div class="container" id="products">
        <h2 style="margin-bottom:20px;">প্রোডাক্টস</h2>
        <div id="product-list" class="grid-products">
            <p style="color:#94a3b8;">প্রোডাক্ট লোড হচ্ছে...</p>
        </div>
    </div>

    <div id="auth-modal" class="modal">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 id="auth-title">Sign In</h3>
                <span style="cursor:pointer;" onclick="closeModal('auth-modal')">✕</span>
            </div>
            <form id="auth-form">
                <div class="form-group">
                    <label>ইমেইল</label>
                    <input type="email" id="auth-email" required>
                </div>
                <div class="form-group">
                    <label>পাসওয়ার্ড</label>
                    <input type="password" id="auth-pass" required>
                </div>
                <button type="submit" class="btn-action" id="auth-submit-btn">Login</button>
            </form>
            <button class="btn-action" style="background:#4285F4; margin-top:10px;" onclick="googleLogin()">Continue with Google</button>
            <p style="font-size:12px; margin-top:10px; text-align:center; cursor:pointer; color:#94a3b8;" onclick="toggleAuthMode()">নতুন অ্যাকাউন্ট খুলতে চান? Sign Up করুন</p>
        </div>
    </div>

    <div id="order-modal" class="modal">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3>অর্ডার কনফার্ম করুন</h3>
                <span style="cursor:pointer;" onclick="closeModal('order-modal')">✕</span>
            </div>
            <form id="checkout-form">
                <input type="hidden" id="order-prod-title">
                <input type="hidden" id="order-prod-price">
                <div class="form-group">
                    <label>আপনার নাম</label>
                    <input type="text" id="cust-name" required>
                </div>
                <div class="form-group">
                    <label>মোবাইল নম্বর</label>
                    <input type="tel" id="cust-phone" required>
                </div>
                <div class="form-group">
                    <label>ঠিকানা</label>
                    <input type="text" id="cust-address" required>
                </div>
                <div class="form-group">
                    <label>পেমেন্ট মেথড</label>
                    <select id="payment-method">
                        <option value="Cash on Delivery">ক্যাশ অন ডেলিভারি (COD)</option>
                        <option value="bKash">বিকাশ</option>
                        <option value="Nagad">নগদ</option>
                    </select>
                </div>
                <div id="payment-instructions" style="font-size:12px; color:#cbd5e1; margin-bottom:10px;"></div>
                <button type="submit" class="btn-action">অর্ডার প্লেস করুন</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnrZ8ZF8tGW2R5buFDsAeLHJlWHBwb9hw",
            authDomain: "easy-mart-bd-16b7b.firebaseapp.com",
            databaseURL: "https://easy-mart-bd-16b7b-default-rtdb.firebaseio.com",
            projectId: "easy-mart-bd-16b7b",
            storageBucket: "easy-mart-bd-16b7b.firebasestorage.app",
            messagingSenderId: "421957488158",
            appId: "1:421957488158:web:7d20d1f557ac6b06c9280f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentUser = null;
        let isSignUp = false;

        // Settings Sync
        onSnapshot(doc(db, "settings", "site_config"), (snap) => {
            if(snap.exists()){
                const data = snap.data();
                if(data.site_name) document.getElementById('site-logo').innerHTML = data.site_name;
                if(data.hero_banner) document.getElementById('hero-banner-text').innerText = data.hero_banner;
                if(data.payment_info) document.getElementById('payment-instructions').innerText = data.payment_info;
            }
        });

        // Load Products
        onSnapshot(collection(db, "products"), (snapshot) => {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            snapshot.forEach(d => {
                const p = d.data();
                list.innerHTML += `
                    <div class="card" data-title="${p.title_bn}">
                        <img src="${p.image}">
                        <div class="card-title">${p.title_bn}</div>
                        <div class="card-price">৳${p.price}</div>
                        <button class="btn-action" onclick="addToCart('${p.title_bn}', ${p.price})">Add to Cart</button>
                    </div>
                `;
            });
        });

        // Auth Logic
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const btn = document.getElementById('auth-btn');
            if(user) {
                btn.innerText = 'Logout';
                btn.onclick = () => signOut(auth);
            } else {
                btn.innerText = 'Login / Sign Up';
                btn.onclick = () => window.openAuthModal();
            }
        });

        window.googleLogin = () => signInWithPopup(auth, new GoogleAuthProvider());
        
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            try {
                if(isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    alert('অ্যাকাউন্ট তৈরি সফল হয়েছে!');
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                    alert('লগইন সফল হয়েছে!');
                }
                window.closeModal('auth-modal');
            } catch(err) { alert(err.message); }
        });

        window.toggleAuthMode = () => {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? 'Sign Up' : 'Sign In';
            document.getElementById('auth-submit-btn').innerText = isSignUp ? 'Register' : 'Login';
        };

        // Checkout
        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "orders"), {
                product: document.getElementById('order-prod-title').value,
                price: document.getElementById('order-prod-price').value,
                customer_name: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                address: document.getElementById('cust-address').value,
                payment: document.getElementById('payment-method').value,
                date: new Date().toLocaleString()
            });
            alert('অর্ডার সম্পন্ন হয়েছে!');
            window.closeModal('order-modal');
        });
    </script>

    <script>
        let cart = [];
        function toggleDrawer(id) { document.getElementById(id).classList.toggle('active'); }
        function openAuthModal() { document.getElementById('auth-modal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function addToCart(title, price) {
            cart.push({title, price});
            document.getElementById('cart-count').innerText = cart.length;
            renderCart();
            toggleDrawer('cart-drawer');
        }

        function renderCart() {
            const list = document.getElementById('cart-items');
            list.innerHTML = '';
            cart.forEach((item) => {
                list.innerHTML += `<div class="cart-item"><span>${item.title}</span> <b>৳${item.price}</b></div>`;
            });
        }

        function openCheckoutFromCart() {
            if(cart.length === 0) return alert('কার্ট খালি!');
            document.getElementById('order-prod-title').value = cart.map(i => i.title).join(', ');
            document.getElementById('order-prod-price').value = cart.reduce((a, b) => a + b.price, 0);
            toggleDrawer('cart-drawer');
            document.getElementById('order-modal').style.display = 'flex';
        }

        function searchProducts() {
            const q = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => {
                c.style.display = c.getAttribute('data-title').toLowerCase().includes(q) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
