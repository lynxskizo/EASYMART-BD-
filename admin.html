<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASYMART BD - Super Admin Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --bg-dark: #0f172a;
            --glass-card: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Security Login Overlay */
        #login-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-card {
            background: var(--glass-card); border: 1px solid var(--glass-border);
            padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center;
        }

        /* Admin Header */
        header {
            background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .brand-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; color: #fff; }
        .logo-icon { width: 34px; height: 34px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; }

        /* Container Layout */
        .admin-container { max-width: 1200px; margin: 24px auto; width: 92%; flex: 1; display: grid; grid-template-columns: 260px 1fr; gap: 20px; }

        /* Sidebar Tabs */
        .sidebar {
            background: var(--glass-card); border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; height: fit-content;
        }
        .nav-tab {
            padding: 12px 16px; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: all 0.3s;
        }
        .nav-tab:hover, .nav-tab.active { background: var(--primary); color: white; box-shadow: 0 4px 15px var(--primary-glow); }

        /* Content Sections */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .glass-box {
            background: var(--glass-card); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 18px; padding: 24px; margin-bottom: 20px;
        }
        .glass-box h3 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }

        /* Forms & Inputs */
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        input, select, textarea {
            width: 100%; padding: 10px 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border); border-radius: 10px; color: white; outline: none; font-size: 14px;
        }
        input:focus, select:focus { border-color: var(--primary); }

        .btn-submit {
            width: 100%; padding: 12px; background: var(--primary); border: none;
            border-radius: 10px; color: white; font-weight: 700; cursor: pointer; font-size: 14px; transition: 0.3s;
        }
        
        .item-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            border-radius: 12px; margin-bottom: 10px; gap: 10px;
        }
        .btn-action { border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: white; }
        .btn-edit { background: #eab308; }
        .btn-delete { background: #ef4444; }

        @media (max-width: 768px) { .admin-container { grid-template-columns: 1fr; } }
            </style>
