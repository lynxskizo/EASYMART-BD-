<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASYMART BD - Digital Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-card: rgba(255, 255, 255, 0.55);
            --bg-color: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-main); padding-bottom: 80px; }

        /* Announcement Notice Bar */
        .notice-bar {
            background: linear-gradient(90deg, #6366f1, #4f46e5); color: #fff;
            padding: 6px 16px; font-size: 12px; font-weight: 600; text-align: center;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* Glass Header */
        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.8); border: 1px solid var(--glass-border);
            width: 38px; height: 38px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-main); font-size: 16px; transition: all 0.3s ease; position: relative;
        }
        .icon-btn:hover { background: var(--primary); color: white; transform: translateY(-2px); }

        .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon {
            width: 36px; height: 36px; background: var(--primary); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .logo-title { font-weight: 800; font-size: 16px; color: #0f172a; line-height: 1; }
        .logo-sub { font-size: 9px; color: var(--primary); font-weight: 800; letter-spacing: 0.8px; margin-top: 2px; }

        .badge { position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* Search Bar */
        .search-container { padding: 12px 16px 6px 16px; }
        .search-box {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 14px; padding: 10px 16px;
        }
        .search-box input { border: none; background: none; outline: none; width: 100%; font-size: 14px; color: var(--text-main); }

        /* Glass Chips Category Bar */
        .chips-container { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
        .chips-container::-webkit-scrollbar { display: none; }
        .chip {
            padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 600;
            white-space: nowrap; cursor: pointer; border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(8px); color: var(--text-main);
            display: flex; align-items: center; gap: 6px; transition: all 0.3s ease;
        }
        .chip.active { background: #0f172a; color: white; border-color: #0f172a; }

        /* Banner Slider */
        .banner-slider { margin: 6px 16px 16px 16px; height: 160px; background: #cbd5e1; border-radius: 18px; overflow: hidden; position: relative; border: 1px solid var(--glass-border); }
        .slider-wrapper { display: flex; height: 100%; transition: transform 0.5s ease-in-out; }
        .slide { min-width: 100%; height: 100%; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        /* Products Grid */
        .section-title { padding: 0 16px 12px 16px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .grid-products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px; }

        .prod-card {
            background: var(--glass-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 18px; padding: 12px;
            display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s ease;
        }
        .prod-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .prod-img { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; background: #e2e8f0; margin-bottom: 8px; }
        .prod-title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        
        .btn-add-cart { width: 100%; padding: 8px; background: var(--primary); border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; margin-top: 8px; font-size: 12px; }

        /* Glass Drawers & Modals */
        .drawer-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 200; }
        .drawer-content {
            position: fixed; top: 0; left: -320px; width: 290px; height: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(25px);
            border-right: 1px solid var(--glass-border); z-index: 201; transition: all 0.3s ease;
            display: flex; flex-direction: column;
        }
        .drawer-content.active { left: 0; }

        .cart-drawer {
            position: fixed; top: 0; right: -320px; width: 300px; height: 100%;
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(25px);
            border-left: 1px solid var(--glass-border); z-index: 201; transition: all 0.3s ease;
            padding: 20px; display: flex; flex-direction: column;
        }
        .cart-drawer.active { right: 0; }

        /* Modal Popup */
        .modal-box {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 400px; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; z-index: 300; box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--text-muted); text-decoration: none; font-weight: 600; gap: 3px; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="notice-bar" id="notice-bar">
        <i class="fa-solid fa-bullhorn"></i> <span id="notice-text">EASYMART BD তে আপনাকে স্বাগতম!</span>
    </div>

    <header>
        <div class="header-left">
            <button class="icon-btn" onclick="toggleMenuDrawer()"><i class="fa-solid fa-bars"></i></button>
            <a href="#" class="brand-logo">
                <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
                <div class="logo-text">
                    <span class="logo-title">EASYMART BD</span>
                    <span class="logo-sub">DIGITAL STORE</span>
                </div>
            </a>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <a id="support-link" href="#" target="_blank" class="icon-btn"><i class="fa-solid fa-headset"></i></a>
            <button class="icon-btn" onclick="toggleCartDrawer()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="badge" id="cart-count">0</span>
            </button>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="প্রোডাক্ট খুঁজুন..." onkeyup="searchProducts()">
        </div>
    </div>

    <div class="banner-slider">
        <div class="slider-wrapper" id="slider-wrapper">
            <div class="slide"><img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=800"></div>
        </div>
    </div>

    <div class="chips-container" id="category-chips">
        <div class="chip active" onclick="filterCategory('All', this)"><i class="fa-solid fa-border-all"></i> All</div>
    </div>

    <div class="section-title">
        <span id="section-cat-title">সকল সার্ভিসসমূহ</span>
    </div>

    <div class="grid-products" id="product-container">
        <p style="color:var(--text-muted); font-size:12px; grid-column:span 2; text-align:center;">প্রোডাক্ট লোড হচ্ছে...</p>
    </div>

    <div class="drawer-overlay" id="drawer-overlay" onclick="closeAllDrawers()"></div>

    <div class="drawer-content" id="menu-drawer">
        <div style="padding:16px; border-bottom:1px solid var(--glass-border); display:flex; justify-content:space-between; align-items:center;">
            <strong style="font-size:16px;">মেনু</strong>
            <button class="icon-btn" onclick="closeAllDrawers()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div style="padding:15px; display:flex; flex-direction:column; gap:10px;">
            <a href="#" class="nav-item" style="flex-direction:row; gap:10px; font-size:14px; color:var(--text-main);"><i class="fa-solid fa-house"></i> হোমপেজ</a>
            <a href="#product-container" onclick="closeAllDrawers()" class="nav-item" style="flex-direction:row; gap:10px; font-size:14px; color:var(--text-main);"><i class="fa-solid fa-box"></i> সকল প্রোডাক্ট</a>
            <a id="drawer-support" href="#" target="_blank" class="nav-item" style="flex-direction:row; gap:10px; font-size:14px; color:var(--text-main);"><i class="fa-brands fa-telegram"></i> টেলিগ্রাম হেল্পলাইন</a>
        </div>
    </div>

    <div class="cart-drawer" id="cart-drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3>আপনার কার্ট</h3>
            <button class="icon-btn" onclick="closeAllDrawers()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cart-items" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px;">
            <p style="font-size:12px; color:var(--text-muted);">কার্ট খালি রয়েছে</p>
        </div>
        <div style="border-top:1px solid var(--glass-border); padding-top:10px; margin-top:10px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:bold;">
                <span>মোট দাম:</span>
                <span id="cart-total" style="color:var(--primary);">৳0</span>
            </div>
            <button class="btn-add-cart" style="padding:12px; font-size:13px;" onclick="openCheckoutModal()">অর্ডার কনফার্ম করুন</button>
        </div>
    </div>

    <div class="modal-box" id="checkout-modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <strong style="font-size:16px;">অর্ডার ফর্ম</strong>
            <button class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="checkout-form" style="display:flex; flex-direction:column; gap:10px;">
            <input type="text" id="cust-name" placeholder="আপনার নাম" required style="padding:10px; border-radius:8px; border:1px solid var(--glass-border); outline:none;">
            <input type="text" id="cust-phone" placeholder="ফোন নম্বর / হোয়াটসঅ্যাপ" required style="padding:10px; border-radius:8px; border:1px solid var(--glass-border); outline:none;">
            <input type="text" id="cust-trx" placeholder="Transaction ID (TrxID)" required style="padding:10px; border-radius:8px; border:1px solid var(--glass-border); outline:none;">
            <div style="font-size:11px; color:var(--text-muted); background:rgba(99,102,241,0.08); padding:8px; border-radius:6px;" id="payment-instruction">
                বিকাশ/নগদ সেন্ড মানি করুন। নম্বর এডমিন প্যানেল থেকে কনফিগার করা হবে।
            </div>
            <button type="submit" class="btn-add-cart" style="padding:10px;">সাবমিট করুন</button>
        </form>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item" onclick="toggleCartDrawer()"><i class="fa-solid fa-bag-shopping"></i>Cart</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnrZ8ZF8tGW2R5buFDsAeLHJlWHBwb9hw",
            authDomain: "easy-mart-bd-16b7b.firebaseapp.com",
            databaseURL: "https://easy-mart-bd-16b7b-default-rtdb.firebaseio.com",
            projectId: "easy-mart-bd-16b7b",
            storageBucket: "easy-mart-bd-16b7b.firebasestorage.app",
            messagingSenderId: "421957488158",
            appId: "1:421957488158:web:7d20d1f557ac6b06c9280f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.allProductsList = [];

        // Fetch General Settings
        onSnapshot(doc(db, "settings", "general"), (d) => {
            if(d.exists()) {
                const data = d.data();
                if(data.notice) document.getElementById('notice-text').innerText = data.notice;
                if(data.support) {
                    document.getElementById('support-link').href = data.support;
                    document.getElementById('drawer-support').href = data.support;
                }
                if(data.payment) {
                    document.getElementById('payment-instruction').innerText = "পেমেন্ট নম্বর (" + data.payment + ") এ সেন্ড মানি করে TrxID ইনপুট দিন।";
                }
            }
        });

        // Fetch Categories
        onSnapshot(collection(db, "categories"), (snap) => {
            const container = document.getElementById('category-chips');
            container.innerHTML = '<div class="chip active" onclick="filterCategory(\'All\', this)"><i class="fa-solid fa-border-all"></i> All</div>';
            snap.forEach(d => {
                const cat = d.data().name;
                container.innerHTML += `<div class="chip" onclick="filterCategory('${cat}', this)">${cat}</div>`;
            });
        });

        // Fetch Products
        onSnapshot(collection(db, "products"), (snap) => {
            const container = document.getElementById('product-container');
            container.innerHTML = '';
            window.allProductsList = [];
            snap.forEach(d => {
                const p = d.data();
                window.allProductsList.push(p);
                container.innerHTML += `
                    <div class="prod-card" data-title="${p.title_bn}" data-cat="${p.category || 'All'}">
                        <img src="${p.image}" class="prod-img">
                        <div class="prod-title">${p.title_bn}</div>
                        <strong style="font-size:13px; color:var(--primary);">৳${p.price}</strong>
                        <button class="btn-add-cart" onclick="addToCart('${p.title_bn}', ${p.price})">অ্যাড করুন</button>
                    </div>
                `;
            });
        });

        // Fetch Banners
        onSnapshot(collection(db, "banners"), (snap) => {
            const wrapper = document.getElementById('slider-wrapper');
            if(!snap.empty) {
                wrapper.innerHTML = '';
                snap.forEach(d => {
                    wrapper.innerHTML += `<div class="slide"><img src="${d.data().image}"></div>`;
                });
            }
        });

        // Submit Order
        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(window.cart.length === 0) return alert("কার্ট খালি!");
            
            await addDoc(collection(db, "orders"), {
                customerName: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                trxId: document.getElementById('cust-trx').value,
                items: window.cart,
                total: window.cart.reduce((sum, i) => sum + i.price, 0),
                status: 'Pending',
                date: new Date().toLocaleString('bn-BD')
            });

            alert("ধন্যবাদ! আপনার অর্ডারটি গ্রহণ করা হয়েছে।");
            window.cart = [];
            renderCart();
            closeModal();
            closeAllDrawers();
        });
    </script>

    <script>
        window.cart = [];

        function toggleMenuDrawer() {
            document.getElementById('menu-drawer').classList.add('active');
            document.getElementById('drawer-overlay').style.display = 'block';
        }

        function toggleCartDrawer() {
            document.getElementById('cart-drawer').classList.add('active');
            document.getElementById('drawer-overlay').style.display = 'block';
        }

        function closeAllDrawers() {
            document.getElementById('menu-drawer').classList.remove('active');
            document.getElementById('cart-drawer').classList.remove('active');
            document.getElementById('drawer-overlay').style.display = 'none';
        }

        function addToCart(title, price) {
            window.cart.push({title, price});
            renderCart();
            toggleCartDrawer();
        }

        function renderCart() {
            const list = document.getElementById('cart-items');
            document.getElementById('cart-count').innerText = window.cart.length;
            list.innerHTML = '';
            let total = 0;
            window.cart.forEach((item, index) => {
                total += item.price;
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px; background:rgba(0,0,0,0.04); border-radius:8px; font-size:12px;">
                        <div><strong>${item.title}</strong><br><span style="color:var(--primary);">৳${item.price}</span></div>
                        <i class="fa-solid fa-trash" style="color:#ef4444; cursor:pointer;" onclick="removeItem(${index})"></i>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = '৳' + total;
        }

        function removeItem(idx) {
            window.cart.splice(idx, 1);
            renderCart();
        }

        function openCheckoutModal() {
            if(window.cart.length === 0) return alert("কার্ট খালি!");
            document.getElementById('checkout-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        function filterCategory(catName, el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('section-cat-title').innerText = catName === 'All' ? 'সকল সার্ভিসসমূহ' : catName;
            
            document.querySelectorAll('.prod-card').forEach(c => {
                if(catName === 'All' || c.getAttribute('data-cat') === catName) {
                    c.style.display = 'flex';
                } else {
                    c.style.display = 'none';
                }
            });
        }

        function searchProducts() {
            const q = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.prod-card').forEach(c => {
                c.style.display = c.getAttribute('data-title').toLowerCase().includes(q) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
