<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASYMART BD - Digital Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --bg-dark: #090d16;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-card: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-modal: rgba(15, 23, 42, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 70px; background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12), transparent 50%); }

        /* Apple Glass Navbar */
        header {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto; padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 20px; font-weight: 800; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }

        .nav-actions { display: flex; gap: 12px; align-items: center; }

        /* Glass Buttons */
        .glass-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white; padding: 8px 14px; border-radius: 12px;
            font-weight: 600; font-size: 13px; cursor: pointer;
            backdrop-filter: blur(10px); display: flex; align-items: center; gap: 6px;
        }
        .glass-btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 15px var(--primary-glow); }

        .btn-primary { background: var(--primary); border: none; }
        .btn-primary:hover { background: #059669; }

        .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; flex: 1; }

        /* Glass Cards Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card {
            background: var(--glass-card);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .product-card:hover { transform: translateY(-5px); border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 12px 30px var(--primary-glow); }
        .product-img { width: 100%; height: 150px; border-radius: 14px; object-fit: cover; background: rgba(255,255,255,0.03); }
        .product-title { font-size: 15px; font-weight: 700; margin: 12px 0 6px; }
        .product-price { font-size: 17px; font-weight: 800; color: var(--primary); margin-bottom: 12px; }

        /* Bottom Mobile Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 99;
        }
        .nav-item { color: var(--text-muted); text-align: center; font-size: 11px; text-decoration: none; cursor: pointer; background: none; border: none; }
        .nav-item.active, .nav-item:hover { color: var(--primary); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 2px; }

        /* Apple Glass Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            display: none; justify-content: center; align-items: center; z-index: 1000; animation: fadeIn 0.3s ease;
        }
        .modal-box {
            background: var(--glass-modal); border: 1px solid var(--glass-border);
            padding: 28px; border-radius: 24px; width: 90%; max-width: 380px; position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .close-btn { position: absolute; top: 16px; right: 20px; font-size: 22px; cursor: pointer; color: var(--text-muted); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 11px 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border); border-radius: 12px; color: white; outline: none; font-size: 14px;
        }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }

        .tab-toggle { display: flex; margin-bottom: 20px; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 4px; }
        .tab-btn { flex: 1; padding: 9px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; cursor: pointer; border-radius: 10px; }
        .tab-btn.active { background: var(--primary); color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">EASYMART <span>BD</span></a>
            <div class="nav-actions">
                <button class="glass-btn" onclick="toggleLanguage()"><i class="fa-solid fa-globe"></i> <span id="lang-btn-text">EN</span></button>
                <button class="glass-btn btn-primary" id="header-auth-btn" onclick="openAuthModal()"><i class="fa-regular fa-user"></i> <span data-key="signin">Sign In</span></button>
                <div id="header-user-profile" style="display:none; align-items:center; gap:8px;">
                    <span id="user-display-name" style="font-size:13px; font-weight:600;"></span>
                    <button class="glass-btn" style="background:#ef4444; border:none;" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 id="page-title" style="font-weight: 700; font-size: 20px;" data-key="available_products">উপলব্ধ প্রোডাক্টসমূহ</h2>
        <div class="products-grid" id="products-container">
            <p style="color:var(--text-muted)" data-key="loading">প্রোডাক্ট লোড হচ্ছে...</p>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active"><i class="fa-solid fa-house"></i><span data-key="nav_home">Home</span></button>
        <button class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span data-key="nav_cart">Cart</span></button>
        <button class="nav-item" id="bottom-auth-btn" onclick="openAuthModal()"><i class="fa-regular fa-user"></i><span id="bottom-auth-text" data-key="signin">Sign In</span></button>
    </div>

    <div class="modal-overlay" id="auth-modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal('auth-modal')">&times;</span>
            <div class="tab-toggle">
                <button class="tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
                <button class="tab-btn" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <form id="form-login">
                <div class="form-group"><label>Email</label><input type="email" id="login-email" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="login-pass" required></div>
                <button type="submit" class="glass-btn btn-primary" style="width:100%; justify-content:center; padding:12px; margin-top:10px;">Sign In</button>
            </form>

            <form id="form-signup" style="display:none;">
                <div class="form-group"><label>Full Name</label><input type="text" id="signup-name" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="signup-email" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="signup-pass" required></div>
                <button type="submit" class="glass-btn btn-primary" style="width:100%; justify-content:center; padding:12px; margin-top:10px;">Create Account</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal('checkout-modal')">&times;</span>
            <h3 style="margin-bottom:12px;" data-key="checkout_title">অর্ডার চেকআউট</h3>
            <p id="checkout-prod-name" style="color:var(--primary); font-weight:bold;"></p>
            <p id="checkout-prod-price" style="margin-bottom:15px; font-weight:bold;"></p>

            <form id="form-checkout">
                <div class="form-group"><label data-key="your_name">আপনার নাম</label><input type="text" id="ord-name" required></div>
                <div class="form-group"><label data-key="phone_number">মোবাইল নম্বর</label><input type="text" id="ord-phone" required></div>
                <div class="form-group"><label>bKash / Nagad TrxID</label><input type="text" id="ord-trx" required></div>
                <button type="submit" class="glass-btn btn-primary" style="width:100%; justify-content:center; padding:12px; margin-top:10px;" data-key="submit_order">অর্ডার সাবমিট করুন</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnrZ8ZF8tGW2R5buFDsAeLHJlWHBwb9hw",
            authDomain: "easy-mart-bd-16b7b.firebaseapp.com",
            databaseURL: "https://easy-mart-bd-16b7b-default-rtdb.firebaseio.com",
            projectId: "easy-mart-bd-16b7b",
            storageBucket: "easy-mart-bd-16b7b.firebasestorage.app",
            messagingSenderId: "421957488158",
            appId: "1:421957488158:web:7d20d1f557ac6b06c9280f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Auth Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('header-auth-btn').style.display = 'none';
                document.getElementById('header-user-profile').style.display = 'flex';
                document.getElementById('user-display-name').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('bottom-auth-text').innerText = 'Account';
            } else {
                currentUser = null;
                document.getElementById('header-auth-btn').style.display = 'flex';
                document.getElementById('header-user-profile').style.display = 'none';
                document.getElementById('bottom-auth-text').innerText = 'Sign In';
            }
        });

        // Sign Up
        document.getElementById('form-signup').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const name = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const pass = document.getElementById('signup-pass').value;

                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(res.user, { displayName: name });
                alert("Account created successfully!");
                closeModal('auth-modal');
            } catch (err) { alert("Sign Up Error: " + err.message); }
        });

        // Sign In
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const email = document.getElementById('login-email').value;
                const pass = document.getElementById('login-pass').value;

                await signInWithEmailAndPassword(auth, email, pass);
                alert("Logged in successfully!");
                closeModal('auth-modal');
            } catch (err) { alert("Sign In Error: " + err.message); }
        });

        // Logout
        window.handleLogout = () => { signOut(auth).then(() => alert("Logged out successfully!")); };

        // Realtime Products Load
        onSnapshot(collection(db, "products"), (snap) => {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            if (snap.empty) {
                container.innerHTML = '<p style="color:var(--text-muted)">No products found.</p>';
                return;
            }

            snap.forEach(docSnap => {
                const p = docSnap.data();
                container.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${p.image || ''}" class="product-img" alt="${p.title_bn}">
                            <div class="product-title">${p.title_bn}</div>
                            <div class="product-price">৳${p.price}</div>
                        </div>
                        <button class="glass-btn btn-primary" style="width:100%; justify-content:center;" onclick="buyProduct('${p.title_bn}', '${p.price}')">Buy Now</button>
                    </div>
                `;
            });
        });

        // Trigger Buy Modal
        window.buyProduct = (title, price) => {
            if (!currentUser) {
                alert("অর্ডার করতে হলে আপনাকে প্রথমে Sign In করতে হবে!");
                openAuthModal();
                return;
            }
            document.getElementById('checkout-prod-name').innerText = title;
            document.getElementById('checkout-prod-price').innerText = "Price: ৳" + price;
            document.getElementById('checkout-modal').style.display = 'flex';
        };

        // Submit Order
        document.getElementById('form-checkout').addEventListener('submit', async (e) => {
            e.preventDefault();
            const orderData = {
                customerName: document.getElementById('ord-name').value,
                phone: document.getElementById('ord-phone').value,
                trxId: document.getElementById('ord-trx').value,
                product: document.getElementById('checkout-prod-name').innerText,
                total: document.getElementById('checkout-prod-price').innerText,
                userId: currentUser.uid,
                userEmail: currentUser.email,
                createdAt: new Date().toISOString()
            };

            await addDoc(collection(db, "orders"), orderData);
            alert("Order submitted successfully!");
            closeModal('checkout-modal');
            e.target.reset();
        });
    </script>

    <script>
        let currentLang = 'BN';

        const translations = {
            BN: {
                signin: "Sign In",
                available_products: "উপলব্ধ প্রোডাক্টসমূহ",
                loading: "প্রোডাক্ট লোড হচ্ছে...",
                nav_home: "হোম",
                nav_cart: "কার্ট",
                checkout_title: "অর্ডার চেকআউট",
                your_name: "আপনার নাম",
                phone_number: "মোবাইল নম্বর",
                submit_order: "অর্ডার সাবমিট করুন"
            },
            EN: {
                signin: "Sign In",
                available_products: "Available Products",
                loading: "Loading Products...",
                nav_home: "Home",
                nav_cart: "Cart",
                checkout_title: "Order Checkout",
                your_name: "Your Name",
                phone_number: "Phone Number",
                submit_order: "Submit Order"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'BN' ? 'EN' : 'BN';
            document.getElementById('lang-btn-text').innerText = currentLang === 'BN' ? 'EN' : 'BN';
            
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
        }

        function openAuthModal() {
            document.getElementById('auth-modal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('form-signup').style.display = 'none';
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-signup').classList.remove('active');
            } else {
                document.getElementById('form-login').style.display = 'none';
                document.getElementById('form-signup').style.display = 'block';
                document.getElementById('tab-signup').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
            }
        }
    </script>
</body>
</html>
