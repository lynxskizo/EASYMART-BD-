<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASYMART BD - Pro Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --primary-hover: #4f46e5; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Hind Siliguri', sans-serif; min-height: 100vh; }

        /* Login Modal */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); width: 90%; max-width: 380px; text-align: center;
        }

        /* Layout */
        .admin-container { display: none; padding: 20px; max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        /* Stats Dashboard */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 10px; text-align: center; }
        .stat-card h3 { font-size: 14px; color: #94a3b8; }
        .stat-card p { font-size: 24px; font-weight: 700; color: var(--primary); margin-top: 5px; }

        /* Forms & Cards */
        .glass-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 20px; margin-bottom: 25px; }
        .glass-card h2 { font-size: 18px; margin-bottom: 15px; color: #f1f5f9; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 4px; color: #cbd5e1; }
        input, select { width: 100%; padding: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: white; outline: none; }
        option { background: #1e293b; color: white; }
        
        .btn { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
        .btn-danger { background: #ef4444; width: auto; padding: 4px 8px; font-size: 12px; margin-top: 5px; }

        .search-box { margin-bottom: 15px; }
        .order-card, .prod-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2 style="margin-bottom: 15px;">Admin Security Login</h2>
            <div class="form-group">
                <input type="text" id="admin-user" placeholder="Username">
            </div>
            <div class="form-group">
                <input type="password" id="admin-pass" placeholder="Password">
            </div>
            <button class="btn" onclick="checkAuth()">Login</button>
            <p id="login-err" style="color:#ef4444; font-size:12px; margin-top:8px; display:none;">ভুল ইউজারনেম বা পাসওয়ার্ড!</p>
        </div>
    </div>

    <div class="admin-container" id="admin-main">
        <div class="header">
            <h1>EASYMART <span>BD</span> Admin Control</h1>
            <button class="btn" style="width:auto; background:#ef4444;" onclick="logout()">Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>মোট অর্ডার</h3>
                <p id="stat-orders">0</p>
            </div>
            <div class="stat-card">
                <h3>মোট সেলস</h3>
                <p id="stat-sales">৳0</p>
            </div>
            <div class="stat-card">
                <h3>মোট প্রোডাক্ট</h3>
                <p id="stat-products">0</p>
            </div>
        </div>

        <div class="glass-card">
            <h2>⚙️ ক্লায়েন্ট ভিউ কাস্টমাইজেশন</h2>
            <form id="site-config-form">
                <div class="form-group">
                    <label>ওয়েবসাইট নাম (Website Title)</label>
                    <input type="text" id="cfg-name" placeholder="EASYMART BD">
                </div>
                <div class="form-group">
                    <label>হিরো ব্যানার টেক্সট (Hero Banner Text)</label>
                    <input type="text" id="cfg-banner" placeholder="আপনার প্রয়োজনীয় সব কেনাকাটা এক জায়গায়">
                </div>
                <button type="submit" class="btn">সেটিং সেভ করুন</button>
            </form>
        </div>

        <div class="glass-card">
            <h2>📦 নতুন প্রোডাক্ট যোগ করুন</h2>
            <form id="prod-form">
                <div class="form-group">
                    <label>প্রোডাক্টের নাম (বাংলা)</label>
                    <input type="text" id="title-bn" required>
                </div>
                <div class="form-group">
                    <label>Product Title (English)</label>
                    <input type="text" id="title-en">
                </div>
                <div class="form-group">
                    <label>ক্যাটাগরি (Category)</label>
                    <select id="category" required>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Groceries">Groceries</option>
                        <option value="Gadgets">Gadgets</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>দাম (৳ / BDT)</label>
                    <input type="number" id="price" required>
                </div>
                <div class="form-group">
                    <label>গ্যালারি থেকে ছবি সিলেক্ট করুন (Image)</label>
                    <input type="file" id="image-file" accept="image/*" required>
                </div>
                <button type="submit" class="btn">পাবলিশ করুন</button>
            </form>
        </div>

        <div class="glass-card">
            <h2>🔍 প্রোডাক্ট লিস্ট ও সার্চ</h2>
            <div class="search-box">
                <input type="text" id="search-prod" placeholder="প্রোডাক্ট খুঁজুন..." onkeyup="filterProds()">
            </div>
            <div id="admin-prod-list">
                <p style="color:#94a3b8;">লোড হচ্ছে...</p>
            </div>
        </div>

        <div class="glass-card">
            <h2>🛒 কাস্টমারদের অর্ডার</h2>
            <div id="orders-list">
                <p style="color:#94a3b8;">অর্ডার লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnrZ8ZF8tGW2R5buFDsAeLHJlWHBwb9hw",
            authDomain: "easy-mart-bd-16b7b.firebaseapp.com",
            databaseURL: "https://easy-mart-bd-16b7b-default-rtdb.firebaseio.com",
            projectId: "easy-mart-bd-16b7b",
            storageBucket: "easy-mart-bd-16b7b.firebasestorage.app",
            messagingSenderId: "421957488158",
            appId: "1:421957488158:web:7d20d1f557ac6b06c9280f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Site Settings Save
        document.getElementById('site-config-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await setDoc(doc(db, "settings", "site_config"), {
                    site_name: document.getElementById('cfg-name').value || 'EASYMART BD',
                    hero_banner: document.getElementById('cfg-banner').value || 'আপনার প্রয়োজনীয় সব কেনাকাটা এক জায়গায়'
                });
                alert('ওয়েবসাইট সেটিংস সেভ হয়েছে!');
            } catch(err) { alert(err.message); }
        });

        // Add Product with Gallery Image (Base64)
        document.getElementById('prod-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('image-file');
            const file = fileInput.files[0];

            if(!file) {
                alert('গ্যালারি থেকে একটি ছবি বেছে নিন!');
                return;
            }

            const reader = new FileReader();
            reader.onload = async function() {
                try {
                    await addDoc(collection(db, "products"), {
                        title_bn: document.getElementById('title-bn').value,
                        title_en: document.getElementById('title-en').value,
                        category: document.getElementById('category').value,
                        price: Number(document.getElementById('price').value),
                        image: reader.result
                    });
                    alert('প্রোডাক্ট সফলভাবে যোগ করা হয়েছে!');
                    e.target.reset();
                } catch(err) { alert(err.message); }
            };
            reader.readAsDataURL(file);
        });

        // Load Products
        onSnapshot(collection(db, "products"), (snapshot) => {
            const list = document.getElementById('admin-prod-list');
            list.innerHTML = '';
            document.getElementById('stat-products').innerText = snapshot.size;
            snapshot.forEach(d => {
                const p = d.data();
                list.innerHTML += `
                    <div class="prod-item" data-name="${p.title_bn}">
                        <strong>${p.title_bn}</strong> (${p.category}) - ৳${p.price}
                        <br><button class="btn btn-danger" onclick="deleteProduct('${d.id}')">Delete</button>
                    </div>
                `;
            });
        });

        // Delete Product
        window.deleteProduct = async (id) => {
            if(confirm('প্রোডাক্টটি মুছে ফেলতে চান?')) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        // Load Orders
        onSnapshot(collection(db, "orders"), (snapshot) => {
            const list = document.getElementById('orders-list');
            list.innerHTML = '';
            let totalSales = 0;
            document.getElementById('stat-orders').innerText = snapshot.size;

            snapshot.forEach(d => {
                const o = d.data();
                totalSales += Number(o.price || 0);
                list.innerHTML += `
                    <div class="order-card">
                        <strong>পণ্য:</strong> ${o.product} (৳${o.price})<br>
                        <strong>কাস্টমার:</strong> ${o.customer_name} (${o.phone})<br>
                        <strong>ঠিকানা:</strong> ${o.address}<br>
                        <strong>পেমেন্ট:</strong> ${o.payment}<br>
                        <small style="color:#6366f1;">তারিখ: ${o.date}</small>
                    </div>
                `;
            });
            document.getElementById('stat-sales').innerText = '৳' + totalSales;
        });
    </script>

    <script>
        function checkAuth() {
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;
            if(u === 'Admin' && p === 'tTtTahsin26') {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-main').style.display = 'block';
                sessionStorage.setItem('admin_logged', 'true');
            } else {
                document.getElementById('login-err').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('admin_logged');
            location.reload();
        }

        if(sessionStorage.getItem('admin_logged') === 'true') {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-main').style.display = 'block';
        }

        function filterProds() {
            const q = document.getElementById('search-prod').value.toLowerCase();
            document.querySelectorAll('.prod-item').forEach(item => {
                const name = item.getAttribute('data-name').toLowerCase();
                item.style.display = name.includes(q) ? 'block' : 'none';
            });
        }
    </script>
</body>
                 </html>
