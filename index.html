<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASYMART BD - Digital Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 70px; }

        header {
            background: #ffffff; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 20px; font-weight: 800; color: #0f172a; text-decoration: none; }
        .logo span { color: var(--primary); }

        .btn-auth {
            background: var(--primary); color: white; border: none; padding: 8px 16px;
            border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px;
        }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; flex: 1; }

        /* Product Cards */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
        .product-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .product-img { width: 100%; height: 140px; border-radius: 10px; object-fit: cover; background: #f1f5f9; }
        .product-title { font-size: 14px; font-weight: 700; margin: 10px 0 4px; color: var(--text-main); }
        .product-price { font-size: 16px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
        
        .btn-buy {
            width: 100%; padding: 8px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #ffffff; border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; padding: 8px 0; z-index: 99;
        }
        .nav-item { color: var(--text-muted); text-align: center; font-size: 11px; text-decoration: none; cursor: pointer; background: none; border: none; }
        .nav-item.active, .nav-item:hover { color: var(--primary); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 2px; }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: #ffffff; padding: 24px; border-radius: 16px; width: 90%; max-width: 360px; position: relative;
        }
        .close-btn { position: absolute; top: 12px; right: 16px; font-size: 20px; cursor: pointer; color: var(--text-muted); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .form-group input {
            width: 100%; padding: 10px; background: #f8fafc;
            border: 1px solid var(--border-color); border-radius: 8px; outline: none; font-size: 13px;
        }

        .tab-toggle { display: flex; margin-bottom: 16px; background: #f1f5f9; border-radius: 8px; padding: 3px; }
        .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; cursor: pointer; border-radius: 6px; font-size: 13px; }
        .tab-btn.active { background: var(--primary); color: white; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">EASYMART <span>BD</span></a>
            <button class="btn-auth" id="header-auth-btn" onclick="openModal('auth-modal')">Sign In</button>
            <div id="header-user" style="display:none; align-items:center; gap:8px;">
                <span id="user-name" style="font-size:13px; font-weight:600;"></span>
                <button class="btn-auth" style="background:#ef4444;" onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 style="font-size:18px; margin-bottom:12px;">উপলব্ধ প্রোডাক্টসমূহ</h2>
        <div class="products-grid" id="products-container">
            <p style="color:var(--text-muted)">প্রোডাক্ট লোড হচ্ছে...</p>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active"><i class="fa-solid fa-house"></i>Home</button>
        <button class="nav-item"><i class="fa-solid fa-cart-shopping"></i>Cart</button>
        <button class="nav-item" onclick="openModal('auth-modal')"><i class="fa-regular fa-user"></i><span id="bottom-auth-text">Sign In</span></button>
    </div>

    <div class="modal-overlay" id="auth-modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal('auth-modal')">&times;</span>
            <div class="tab-toggle">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
                <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <form id="form-login">
                <div class="form-group"><label>Email</label><input type="email" id="login-email" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="login-pass" required></div>
                <button type="submit" class="btn-buy" style="margin-top:8px;">Sign In</button>
            </form>

            <form id="form-signup" style="display:none;">
                <div class="form-group"><label>Full Name</label><input type="text" id="signup-name" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="signup-email" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="signup-pass" required></div>
                <button type="submit" class="btn-buy" style="margin-top:8px;">Create Account</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal('checkout-modal')">&times;</span>
            <h3 style="margin-bottom:10px; font-size:16px;">অর্ডার চেকআউট</h3>
            <p id="checkout-prod-name" style="color:var(--primary); font-weight:bold; font-size:14px;"></p>
            <p id="checkout-prod-price" style="margin-bottom:12px; font-weight:bold; font-size:14px;"></p>

            <form id="form-checkout">
                <div class="form-group"><label>আপনার নাম</label><input type="text" id="ord-name" required></div>
                <div class="form-group"><label>মোবাইল নম্বর</label><input type="text" id="ord-phone" required></div>
                <div class="form-group"><label>bKash / Nagad TrxID</label><input type="text" id="ord-trx" required></div>
                <button type="submit" class="btn-buy" style="margin-top:8px;">অর্ডার সাবমিট করুন</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnrZ8ZF8tGW2R5buFDsAeLHJlWHBwb9hw",
            authDomain: "easy-mart-bd-16b7b.firebaseapp.com",
            databaseURL: "https://easy-mart-bd-16b7b-default-rtdb.firebaseio.com",
            projectId: "easy-mart-bd-16b7b",
            storageBucket: "easy-mart-bd-16b7b.firebasestorage.app",
            messagingSenderId: "421957488158",
            appId: "1:421957488158:web:7d20d1f557ac6b06c9280f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('header-auth-btn').style.display = 'none';
                document.getElementById('header-user').style.display = 'flex';
                document.getElementById('user-name').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('bottom-auth-text').innerText = 'Account';
            } else {
                currentUser = null;
                document.getElementById('header-auth-btn').style.display = 'block';
                document.getElementById('header-user').style.display = 'none';
                document.getElementById('bottom-auth-text').innerText = 'Sign In';
            }
        });

        document.getElementById('form-signup').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const name = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const pass = document.getElementById('signup-pass').value;

                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(res.user, { displayName: name });
                alert("Account created successfully!");
                closeModal('auth-modal');
            } catch (err) { alert("Error: " + err.message); }
        });

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const email = document.getElementById('login-email').value;
                const pass = document.getElementById('login-pass').value;

                await signInWithEmailAndPassword(auth, email, pass);
                alert("Signed in successfully!");
                closeModal('auth-modal');
            } catch (err) { alert("Error: " + err.message); }
        });

        window.logout = () => signOut(auth);

        onSnapshot(collection(db, "products"), (snap) => {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            if (snap.empty) {
                container.innerHTML = '<p style="color:var(--text-muted)">কোনো প্রোডাক্ট নেই।</p>';
                return;
            }
            snap.forEach(docSnap => {
                const p = docSnap.data();
                container.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${p.image || ''}" class="product-img">
                            <div class="product-title">${p.title_bn}</div>
                            <div class="product-price">৳${p.price}</div>
                        </div>
                        <button class="btn-buy" onclick="buyProduct('${p.title_bn}', '${p.price}')">Buy Now</button>
                    </div>
                `;
            });
        });

        window.buyProduct = (title, price) => {
            if (!currentUser) {
                alert("অর্ডার করতে আগে Sign In বা Sign Up করুন!");
                openModal('auth-modal');
                return;
            }
            document.getElementById('checkout-prod-name').innerText = title;
            document.getElementById('checkout-prod-price').innerText = "Price: ৳" + price;
            openModal('checkout-modal');
        };

        document.getElementById('form-checkout').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "orders"), {
                customerName: document.getElementById('ord-name').value,
                phone: document.getElementById('ord-phone').value,
                trxId: document.getElementById('ord-trx').value,
                product: document.getElementById('checkout-prod-name').innerText,
                total: document.getElementById('checkout-prod-price').innerText,
                userId: currentUser.uid,
                userEmail: currentUser.email,
                createdAt: new Date().toISOString()
            });
            alert("অর্ডার সফলভাবে প্লেস করা হয়েছে!");
            closeModal('checkout-modal');
            e.target.reset();
        });
    </script>

    <script>
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('form-signup').style.display = 'none';
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-signup').classList.remove('active');
            } else {
                document.getElementById('form-login').style.display = 'none';
                document.getElementById('form-signup').style.display = 'block';
                document.getElementById('tab-signup').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
            }
        }
    </script>
</body>
</html>
